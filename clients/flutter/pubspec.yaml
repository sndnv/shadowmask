name: shadowmask
description: "Shadowmask Flutter client (web-first)."
version: 0.0.11

publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  fluro: ^2.0.5
  http: ^1.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.2
  intl: ^0.20.3
  web: ^1.1.2
  flutter_dotenv: ^6.0.0
  window_manager: ^0.5.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  screen_retriever: ^0.2.2
  cached_network_image: ^4.0.6
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  path: ^1.9.1
  xdg_directories: ^1.1.0
  uuid: ^4.6.0
  cryptography: ^2.9.0
  convert: ^3.1.2

dependency_overrides:
  # Linux renders in software on Flutter 3.38+ (media-kit#1404);
  # the fork is upstream main + PR media-kit#1466; drop once a release includes #1466
  media_kit_video:
    git:
      url: https://github.com/sndnv/media-kit.git
      ref: 5c533691f0f1d75747b5cdad2456cc09de91ec9b
      path: media_kit_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/sndnv/media-kit.git
      ref: 5c533691f0f1d75747b5cdad2456cc09de91ec9b
      path: libs/macos/media_kit_libs_macos_video
  media_kit_libs_ios_video:
    git:
      url: https://github.com/sndnv/media-kit.git
      ref: 5c533691f0f1d75747b5cdad2456cc09de91ec9b
      path: libs/ios/media_kit_libs_ios_video

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  mutation_test: ^1.8.1

flutter:
  uses-material-design: true
  assets:
    - CREDITS.md
    - assets/licenses/
    - assets/attribution/
    - assets/fonts/
    - assets/glyphs/
