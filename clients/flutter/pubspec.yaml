name: shadowmask
description: "Shadowmask Flutter client (web-first)."
version: 1.0.0-SNAPSHOT

publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fluro: ^2.0.5
  http: ^1.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  web: ^1.1.0
  flutter_dotenv: ^6.0.0
  window_manager: ^0.5.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4
  screen_retriever: ^0.2.2
  cached_network_image: ^4.0.0
  device_info_plus: ^13.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^4.0.0
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
