<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Person</title>
  </head>
  <body>
    <nav id="nav"></nav>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      if (sm.requireAuth()) load();

      async function load() {
        const main = document.getElementById("main");
        const id = sm.qs("id");
        if (!id) {
          main.textContent = "Unknown person.";
          return;
        }
        try {
          const person = await sm.json("/api/v1/people/" + encodeURIComponent(id));
          const me = await sm.self().catch(() => null);
          main.textContent = "";

          const facts = sm.el("dl");
          const addFact = (key, value) => {
            if (!value) return;
            facts.appendChild(sm.el("dt", { text: key }));
            facts.appendChild(sm.el("dd", { text: value }));
          };
          addFact("Born", person.birthday);
          addFact("Died", person.deathday);
          addFact("Place of birth", person.place_of_birth);
          if (person.also_known_as && person.also_known_as.length) {
            addFact("Also known as", person.also_known_as.join(", "));
          }
          const info = sm.el("div", { class: "sm-detail-info" }, [
            sm.el("h1", { text: person.name }),
            facts,
            person.biography ? sm.el("p", { text: person.biography }) : null,
          ]);
          const photo = sm.poster(person.artwork, 300, person.name, "placeholder-person.svg");
          main.appendChild(sm.el("div", { class: "sm-detail" }, [photo, info]));

          if (me && me.role === "admin") {
            const refresh = sm.el("button", { type: "button", class: "sm-secondary" }, "Refresh info");
            refresh.addEventListener("click", async () => {
              refresh.disabled = true;
              try {
                await sm.json("/api/v1/people/" + encodeURIComponent(id) + "/refresh", {
                  method: "POST",
                });
                sm.toast("Queued. Track it under Jobs.", "ok");
              } catch (err) {
                refresh.disabled = false;
                sm.toast("Refresh failed.", "danger");
              }
            });
            main.appendChild(sm.el("p", null, refresh));
          }

          main.appendChild(
            sm.el("h2", { text: "Filmography (" + (person.filmography || []).length + ")" }),
          );
          if (!person.filmography || !person.filmography.length) {
            main.appendChild(sm.el("p", { text: "No known titles." }));
            return;
          }
          main.appendChild(
            sm.grid(
              person.filmography.map((f) => ({
                href: f.kind === "series" ? sm.href.series(f.title_id) : sm.href.movie(f.title_id),
                artwork: f.artwork,
                title: f.display_title + (f.year ? " (" + f.year + ")" : ""),
                subtitle: f.role + (f.character ? " as " + f.character : ""),
              })),
            ),
          );
        } catch (err) {
          main.textContent = "Could not load this person.";
        }
      }
    </script>
  </body>
</html>
