<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Libraries</title>
  </head>
  <body>
    <h1>Libraries</h1>
    <nav id="nav"></nav>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      if (sm.requireAuth()) load();

      async function load() {
        const main = document.getElementById("main");
        try {
          const libraries = await sm.json("/api/v1/libraries");
          main.textContent = "";
          main.appendChild(sm.breadcrumbs([{ label: "Libraries (" + libraries.length + ")" }]));
          if (!libraries.length) {
            main.appendChild(sm.el("p", { text: "No libraries." }));
            return;
          }
          const rows = libraries.map((l) => {
            const browseHref =
              l.kind === "tv"
                ? sm.url("catalog/series.html?library=" + encodeURIComponent(l.id))
                : sm.url("catalog/movies.html?library=" + encodeURIComponent(l.id));
            return [
              sm.el("a", { href: browseHref }, l.name),
              l.kind,
              l.watcher,
              (l.metadata_sources || []).join(", "),
              (l.roots || []).join(", "),
            ];
          });
          main.appendChild(sm.table(["Name", "Type", "Watcher", "Metadata", "Roots"], rows));
        } catch (err) {
          main.textContent = "Could not load libraries.";
        }
      }
    </script>
  </body>
</html>
