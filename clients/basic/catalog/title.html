<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Title</title>
  </head>
  <body>
    <nav id="nav"></nav>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      if (sm.requireAuth()) load();

      async function load() {
        const main = document.getElementById("main");
        const type = sm.qs("type");
        const id = sm.qs("id");
        if (!id || (type !== "movie" && type !== "series")) {
          main.textContent = "Unknown title.";
          return;
        }
        try {
          if (type === "movie") await renderMovie(main, id);
          else await renderSeries(main, id);
        } catch (err) {
          main.textContent = "Could not load this title.";
        }
      }

      function ratingLine(cr) {
        return cr ? cr.system + " " + cr.code : null;
      }

      function header(main, d, lines, playHref) {
        const backdrop = sm.img(d.artwork, "backdrop", 960);
        if (backdrop) {
          backdrop.setAttribute("class", "sm-backdrop");
          main.appendChild(backdrop);
        }
        const dl = sm.el("dl");
        for (const [key, value] of lines) {
          if (value === null || value === undefined || value === "") continue;
          dl.appendChild(sm.el("dt", { text: key }));
          dl.appendChild(sm.el("dd", { text: String(value) }));
        }
        const info = sm.el("div", { class: "sm-detail-info" }, [
          sm.el("h1", { text: d.title + (d.year ? " (" + d.year + ")" : "") }),
          dl,
          d.overview ? sm.el("p", { text: d.overview }) : null,
        ]);
        const posterNode = sm.poster(d.artwork, 480, d.title);
        const posterEl = playHref
          ? sm.el("a", { href: playHref, title: "Play", "aria-label": "Play " + d.title }, posterNode)
          : posterNode;
        main.appendChild(sm.el("div", { class: "sm-detail" }, [posterEl, info]));
      }

      function genresInto(parent, d) {
        if (!d.genres || !d.genres.length) return;
        parent.appendChild(sm.el("h2", { text: "Genres (" + d.genres.length + ")" }));
        parent.appendChild(
          sm.el(
            "ul",
            null,
            d.genres.map((g) =>
              sm.el(
                "li",
                null,
                sm.el(
                  "a",
                  {
                    href: sm.url(
                      (sm.qs("type") === "series"
                        ? "catalog/series.html"
                        : "catalog/movies.html") +
                        "?genres=" +
                        encodeURIComponent(g.name),
                    ),
                  },
                  g.name,
                ),
              ),
            ),
          ),
        );
      }

      function chipRow(main, d) {
        const cols = sm.el("div", { class: "sm-cols" });
        const genres = sm.el("section");
        genresInto(genres, d);
        const ratings = sm.el("section");
        listOf(ratings, "Ratings", d.ratings, (r) => r.source + ": " + r.value);
        const ids = sm.el("section");
        externalIds(ids, d.external_ids);
        for (const section of [genres, ratings, ids]) {
          if (section.childNodes.length) cols.appendChild(section);
        }
        if (cols.childNodes.length) main.appendChild(cols);
      }

      function castSection(main, d) {
        if (d.credits && d.credits.length) {
          main.appendChild(sm.el("h2", { text: "Cast and crew (" + d.credits.length + ")" }));
          main.appendChild(
            sm.el(
              "ul",
              null,
              d.credits.map((c) =>
                sm.el("li", null, [
                  sm.el("a", { href: sm.href.person(c.person.id) }, c.person.name),
                  " " + c.role + (c.character ? " as " : ""),
                  c.character ? sm.el("strong", { text: c.character }) : null,
                ]),
              ),
            ),
          );
        }
      }

      function tailSections(main, d) {
        listOf(main, "Studios", d.studios, (s) => s.name);
        listOf(main, "Extras", d.extras, (x) => x.kind + ": " + x.title);
      }

      function listOf(main, label, items, fmt) {
        if (!items || !items.length) return;
        main.appendChild(sm.el("h2", { text: label + " (" + items.length + ")" }));
        main.appendChild(sm.el("ul", null, items.map((i) => sm.el("li", { text: fmt(i) }))));
      }

      function externalIdUrl(source, value) {
        if (source === "tmdb") return "https://www.themoviedb.org/" + value;
        if (source === "imdb") {
          const path = value.indexOf("nm") === 0 ? "name/" : "title/";
          return "https://www.imdb.com/" + path + value + "/";
        }
        return null;
      }

      function externalIds(main, items) {
        if (!items || !items.length) return;
        main.appendChild(sm.el("h2", { text: "External ids (" + items.length + ")" }));
        main.appendChild(
          sm.el(
            "ul",
            null,
            items.map((x) => {
              const label = x.source + ": " + x.value;
              const href = externalIdUrl(x.source, x.value);
              return sm.el(
                "li",
                null,
                href
                  ? sm.el("a", { href, target: "_blank", rel: "noopener noreferrer" }, label)
                  : label,
              );
            }),
          ),
        );
      }

      async function renderMovie(main, id) {
        const d = await sm.json("/api/v1/movies/" + encodeURIComponent(id));
        const versions = await sm
          .json("/api/v1/movies/" + encodeURIComponent(id) + "/versions")
          .catch(() => null);
        const me = await sm.self().catch(() => null);
        const picker = await sm.versionPicker(me && me.id, (versions && versions.items) || []);
        main.textContent = "";
        main.appendChild(
          sm.breadcrumbs([
            { label: "Movies", href: sm.url("catalog/movies.html") },
            { label: d.title },
          ]),
        );
        header(
          main,
          d,
          [
            ["Runtime", d.runtime_minutes ? d.runtime_minutes + " min" : null],
            ["Rating", ratingLine(d.content_rating)],
            ["Added", sm.time(d.added_at)],
            ["Updated", sm.time(d.updated_at)],
          ],
          picker.single ? sm.href.watch(picker.single) : null,
        );
        const movieControls = await sm.libraryControls("movie", id);
        main.appendChild(movieControls);
        if (me && me.role === "admin") {
          const held = ((versions && versions.items) || []).length;
          movieControls.appendChild(document.createTextNode(" "));
          movieControls.appendChild(sm.refreshMetadataButton("movies", id));
          movieControls.appendChild(document.createTextNode(" "));
          movieControls.appendChild(
            sm.deleteTitleButton(
              "movies",
              id,
              d.title,
              held === 0
                ? null
                : "Remove its " +
                    held +
                    (held === 1 ? " remaining version" : " remaining versions") +
                    " first.",
              () => {
                window.location.href = sm.url("catalog/movies.html");
              },
            ),
          );
        }
        main.appendChild(picker.node);
        chipRow(main, d);
        castSection(main, d);
        tailSections(main, d);
      }

      async function nextEpisodeHref(seriesId, seasons) {
        const me = await sm.self().catch(() => null);
        let ep = await sm.onDeckEpisode(me && me.id, seasons.map((s) => s.id));
        if (!ep && seasons.length) {
          const firstSeason = seasons.slice().sort((a, b) => (a.number || 0) - (b.number || 0))[0];
          const eps = await sm
            .json(
              "/api/v1/series/" +
                encodeURIComponent(seriesId) +
                "/seasons/" +
                encodeURIComponent(firstSeason.id) +
                "/episodes",
            )
            .catch(() => []);
          ep = eps.slice().sort((a, b) => (a.number || 0) - (b.number || 0))[0] || null;
        }
        return ep ? sm.href.episode(ep.id, ep.season_id, seriesId) : null;
      }

      async function renderSeries(main, id) {
        const d = await sm.json("/api/v1/series/" + encodeURIComponent(id));
        const seasons = await sm
          .json("/api/v1/series/" + encodeURIComponent(id) + "/seasons")
          .catch(() => []);
        const nextHref = await nextEpisodeHref(id, seasons);
        const me = await sm.self().catch(() => null);
        main.textContent = "";
        main.appendChild(
          sm.breadcrumbs([
            { label: "Series", href: sm.url("catalog/series.html") },
            { label: d.title },
          ]),
        );
        header(
          main,
          d,
          [
            ["Rating", ratingLine(d.content_rating)],
            ["Added", sm.time(d.added_at)],
            ["Updated", sm.time(d.updated_at)],
          ],
          nextHref,
        );
        const seriesControls = await sm.watchedControls("series", id);
        main.appendChild(seriesControls);
        if (me && me.role === "admin") {
          seriesControls.appendChild(document.createTextNode(" "));
          seriesControls.appendChild(sm.refreshMetadataButton("series", id));
          seriesControls.appendChild(document.createTextNode(" "));
          seriesControls.appendChild(
            sm.deleteTitleButton(
              "series",
              id,
              d.title,
              seasons.length === 0
                ? null
                : "Delete its " +
                    seasons.length +
                    (seasons.length === 1
                      ? " remaining season"
                      : " remaining seasons") +
                    " first.",
              () => {
                window.location.href = sm.url("catalog/series.html");
              },
            ),
          );
        }
        chipRow(main, d);
        castSection(main, d);
        main.appendChild(sm.el("h2", { text: "Seasons (" + seasons.length + ")" }));
        if (!seasons.length) {
          main.appendChild(sm.el("p", { text: "No seasons." }));
        } else {
          main.appendChild(
            sm.grid(
              seasons.map((s) => ({
                href: sm.href.season(s.id, id),
                artwork: s.artwork,
                title: s.title || "Season " + s.number,
                subtitle: null,
              })),
            ),
          );
        }
        tailSections(main, d);
      }

    </script>
  </body>
</html>
