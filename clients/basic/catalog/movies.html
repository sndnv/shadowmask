<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Movies</title>
  </head>
  <body>
    <h1 class="sm-visually-hidden">Movies</h1>
    <nav id="nav"></nav>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      if (sm.requireAuth()) load();

      async function load() {
        const main = document.getElementById("main");
        const params = new URLSearchParams(location.search);
        try {
          const page = await sm.json("/api/v1/movies?" + params.toString());
          const genres = await sm.json("/api/v1/genres?kind=movie").catch(() => []);
          main.textContent = "";
          main.appendChild(sm.breadcrumbs([{ label: "Movies (" + page.total + ")" }]));
          main.appendChild(sm.sortControls(params, genres));
          if (params.get("library")) {
            main.appendChild(sm.el("p", { text: "Library filter: " + params.get("library") }));
          }
          if (!page.items.length) {
            main.appendChild(await sm.accessAwareEmpty("movies"));
          } else {
            main.appendChild(
              sm.grid(
                page.items.map((m) => ({
                  href: sm.href.movie(m.id),
                  artwork: m.artwork,
                  title: m.title,
                  subtitle: m.year ? String(m.year) : null,
                  ref: { type: "movie", id: m.id },
                })),
              ),
            );
          }
          if (page.total) {
            main.appendChild(sm.pager(page.total, page.offset, page.limit));
          }
        } catch (err) {
          main.textContent = "Could not load movies.";
        }
      }
    </script>
  </body>
</html>
