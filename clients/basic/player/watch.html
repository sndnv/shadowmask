<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Watch</title>
  </head>
  <body>
    <nav id="nav"></nav>
    <main id="main">
      <h1 class="sm-visually-hidden">Watch</h1>
      <p id="back"></p>
      <div class="sm-player">
        <video id="player" playsinline width="960"></video>
        <pre id="diag" class="sm-diag" hidden></pre>
        <div class="sm-bar">
          <button type="button" id="play" class="sm-secondary" disabled>Play</button>
          <input type="range" id="scrub" min="0" max="0" step="1000" value="0" aria-label="Position" disabled />
          <span id="clock" class="sm-clock">0:00 / 0:00</span>
          <button type="button" id="mute" class="sm-secondary">Mute</button>
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
          <button type="button" id="fullscreen" class="sm-secondary">Fullscreen</button>
        </div>
      </div>
      <div id="controls"></div>
      <p id="status" aria-live="polite">Loading&hellip;</p>
      <button type="button" id="retry" class="sm-secondary" hidden>Retry</button>
    </main>
    <script src="../vendor/hls.min.js"></script>
    <script src="../app.js"></script>
    <script type="module">
      import { PlaybackRunner } from "./runner.js";
      import { audioLabels, subtitleLabels } from "./labels.js";
      import { measureDecoding } from "./capabilities.js";
      import {
        controlsFromQuery,
        controlsToQuery,
        DELIVERY_MODES,
        NETWORK_TIMEOUTS,
        trackFromWire,
        trackToWire,
        watching,
      } from "./session.js";

      sm.chrome();
      const video = document.getElementById("player");
      video.dataset.subtitleSize = sm.subtitleSize();
      const timeoutKey = "shadowmask.player.network_timeout";
      const versionId = sm.qs("version");
      const player = videoPlayer(video);
      const ui = {};
      let runner = null;
      let version = null;
      let gatherFailed = null;
      let scrubbing = false;
      let busyFocus = null;
      let diagTimer = null;
      let screenLock = null;
      let awake = false;

      if (sm.requireAuth()) open();

      function loadChoice(key, options, fallback) {
        let stored = null;
        try {
          stored = parseInt(localStorage.getItem(key), 10);
        } catch (err) {
          void err;
        }
        return options.indexOf(stored) >= 0 ? stored : fallback;
      }

      function saveLocal(local) {
        try {
          localStorage.setItem(timeoutKey, String(local.networkTimeoutS));
        } catch (err) {
          void err;
        }
      }

      function clientPlatform() {
        const agent = navigator.userAgent;
        if (agent.includes("Chrome/") || agent.includes("Chromium/")) return "chrome";
        if (agent.includes("Firefox/")) return "firefox";
        if (agent.includes("Safari/")) return "safari";
        return "generic";
      }

      function sessionApi() {
        const path = (id) => "/api/v1/sessions/" + encodeURIComponent(id);
        const post = (body, extra) =>
          Object.assign({ method: "POST", body: JSON.stringify(body) }, extra || {});
        return {
          start: (body) => sm.json("/api/v1/sessions", post(body)),
          update: (id, body) => sm.json(path(id) + "/update", post(body)),
          seek: (id, positionMs) => sm.json(path(id) + "/seek", post({ position_ms: positionMs })),
          progress: (id, positionMs, state) =>
            sm.api(path(id) + "/progress", post({ position_ms: positionMs, state }, { keepalive: true })),
          end: (id) => {
            const t = sm.tokens();
            const token = t && t.access_token;
            return fetch(path(id), {
              method: "DELETE",
              headers: token ? { Authorization: "Bearer " + token } : {},
              keepalive: true,
            });
          },
        };
      }

      function bufferedAhead(media) {
        const ranges = media.buffered;
        const at = media.currentTime;
        for (let i = 0; i < ranges.length; i++) {
          if (at >= ranges.start(i) - 0.5 && at <= ranges.end(i)) {
            return Math.max(0, ranges.end(i) - at);
          }
        }
        return 0;
      }

      function mediaError(error) {
        const names = ["media error", "aborted", "network error", "decode error", "format not supported"];
        return (error && names[error.code]) || names[0];
      }

      function videoPlayer(media) {
        let hls = null;
        let networkTimeoutS = NETWORK_TIMEOUTS[0];
        let pending = null;
        let onMeta = null;
        let loaded = false;
        let own = false;
        let seekTimer = null;
        let onReading = null;
        let onError = null;
        let onSeek = null;

        function reading() {
          return {
            positionMs: Math.floor(media.currentTime * 1000),
            durationMs: Number.isFinite(media.duration) ? Math.floor(media.duration * 1000) : 0,
            bufferedAheadMs: Math.floor(bufferedAhead(media) * 1000),
            playing: !media.paused,
            ended: media.ended,
          };
        }

        function report() {
          if (onReading) onReading(reading());
        }

        function fail(detail) {
          if (pending) {
            const p = pending;
            pending = null;
            p.reject(new Error(detail));
            return;
          }
          if (loaded && onError) onError("Playback failed (" + detail + ").");
        }

        function drop(reason) {
          if (onMeta) {
            media.removeEventListener("loadedmetadata", onMeta);
            onMeta = null;
          }
          if (pending) {
            const p = pending;
            pending = null;
            p.reject(new Error(reason));
          }
        }

        function teardown() {
          loaded = false;
          clearTimeout(seekTimer);
          seekTimer = null;
          if (hls) {
            hls.destroy();
            hls = null;
          }
          for (const track of media.querySelectorAll("track")) {
            track.remove();
          }
          if (media.getAttribute("src")) {
            media.removeAttribute("src");
            media.load();
          }
        }

        function addSubtitleFile(url) {
          const track = document.createElement("track");
          track.kind = "subtitles";
          track.src = url;
          track.default = true;
          media.appendChild(track);
          track.track.mode = "showing";
        }

        function hlsConfig() {
          const wait = networkTimeoutS * 1000;
          return { manifestLoadingTimeOut: wait, levelLoadingTimeOut: wait, fragLoadingTimeOut: wait };
        }

        function attach(url, mode, offsetMs, subtitleUrl) {
          drop("superseded");
          teardown();
          return new Promise((resolve, reject) => {
            const mine = { resolve, reject };
            pending = mine;
            const ready = () => {
              if (pending !== mine) return;
              pending = null;
              onMeta = null;
              if (offsetMs) {
                own = true;
                media.currentTime = offsetMs / 1000;
              }
              loaded = true;
              resolve();
            };
            if (mode !== "direct" && window.Hls && window.Hls.isSupported()) {
              const instance = new window.Hls(hlsConfig());
              hls = instance;
              instance.on(window.Hls.Events.MANIFEST_PARSED, ready);
              instance.on(window.Hls.Events.FRAG_BUFFERED, report);
              instance.on(window.Hls.Events.ERROR, (_, data) => {
                if (hls === instance && data && data.fatal) fail(data.details || data.type || "stream error");
              });
              instance.loadSource(url);
              instance.attachMedia(media);
              return;
            }
            if (mode === "direct" || media.canPlayType("application/vnd.apple.mpegurl")) {
              onMeta = ready;
              media.addEventListener("loadedmetadata", onMeta, { once: true });
              media.src = url;
              if (mode === "direct" && subtitleUrl) addSubtitleFile(subtitleUrl);
              return;
            }
            fail("this browser needs hls.js or native HLS");
          });
        }

        for (const name of ["timeupdate", "durationchange", "loadedmetadata", "play", "pause", "ended", "progress", "seeked"]) {
          media.addEventListener(name, report);
        }
        media.addEventListener("seeked", () => {
          own = false;
        });
        media.addEventListener("seeking", () => {
          if (own || !loaded) return;
          clearTimeout(seekTimer);
          seekTimer = setTimeout(() => {
            if (loaded && onSeek) onSeek(Math.floor(media.currentTime * 1000));
          }, 300);
        });
        media.addEventListener("error", () => {
          if (pending || loaded) fail(mediaError(media.error));
        });

        return {
          listen(reads, errs, seeks) {
            onReading = reads;
            onError = errs;
            onSeek = seeks;
            return () => {
              onReading = null;
              onError = null;
              onSeek = null;
            };
          },
          reading,
          attach,
          seekTo(offsetMs) {
            own = true;
            media.currentTime = offsetMs / 1000;
          },
          play() {
            const started = media.play();
            if (started && started.catch) {
              started.catch((err) => {
                if (!err || err.name !== "NotAllowedError") return;
                media.muted = true;
                media.play().catch(() => {});
              });
            }
          },
          pause() {
            media.pause();
          },
          detach() {
            drop("detached");
            teardown();
          },
          setNetworkTimeout(seconds) {
            networkTimeoutS = seconds;
            if (!hls) return;
            const wait = seconds * 1000;
            for (const key of ["manifestLoadPolicy", "playlistLoadPolicy", "fragLoadPolicy"]) {
              Object.assign(hls.config[key].default, { maxTimeToFirstByteMs: wait, maxLoadTimeMs: wait });
            }
          },
          hls: () => hls,
        };
      }

      async function open() {
        if (!versionId) {
          document.getElementById("status").textContent = "No version specified.";
          return;
        }
        runner = new PlaybackRunner({
          api: sessionApi(),
          player,
          platform: clientPlatform(),
          saveLocal,
          versionId,
          remote: controlsFromQuery(new URLSearchParams(location.search)),
          local: { networkTimeoutS: loadChoice(timeoutKey, NETWORK_TIMEOUTS, NETWORK_TIMEOUTS[0]) },
          playing: true,
        });
        runner.subscribe(render);
        window.addEventListener("pagehide", () => {
          runner.leave();
          stopDiag();
          holdScreen(false);
        });
        window.addEventListener("pageshow", (e) => {
          if (e.persisted && runner.state.status.life === "closed") location.reload();
        });
        wireBar();
        wireScreenLock();
        render(runner.state, null);
        await gather();
      }

      async function gather() {
        try {
          const me = await sm.self();
          const [info, resume, detail, decoding] = await Promise.all([
            sm.json("/api/v1/server/info").catch(() => ({ profile_version: 1 })),
            sm
              .json("/api/v1/users/" + encodeURIComponent(me.id) + "/progress/" + encodeURIComponent(versionId))
              .catch(() => null),
            sm.json("/api/v1/versions/" + encodeURIComponent(versionId)).catch(() => null),
            measureDecoding().catch(() => null),
          ]);
          version = detail;
          buildControls();
          renderBreadcrumb(version);
          runner.opened({
            durationMs: (version && version.duration_ms) || 0,
            resumeMs: resume && resume.position_ms ? resume.position_ms : 0,
            profileVersion: info.profile_version || 1,
            decoding,
          });
          render(runner.state, null);
        } catch (err) {
          gatherFailed = "Could not start playback (" + err.message + ").";
          render(runner.state, null);
        }
      }

      function render(s, before) {
        renderBar(s);
        renderStatus(s);
        renderControls(s);
        restoreFocus();
        const wasStart = before && before.status.sent && before.status.sent.kind === "start";
        if (before && before.status.gathered && !wasStart && s.remote !== before.remote) {
          history.replaceState(null, "", location.pathname + "?" + controlsToQuery(versionId, s.remote));
        }
      }

      function setDisabled(el, disabled) {
        if (disabled && !el.disabled && el === document.activeElement) busyFocus = el;
        el.disabled = disabled;
      }

      function restoreFocus() {
        if (!busyFocus || busyFocus.disabled) return;
        const now = document.activeElement;
        if (!now || now === document.body) busyFocus.focus({ preventScroll: true });
        busyFocus = null;
      }

      function renderBar(s) {
        const scrub = document.getElementById("scrub");
        const play = document.getElementById("play");
        const total = s.durationMs;
        const at = scrubbing ? parseInt(scrub.value, 10) : Math.min(s.timeline.positionMs, total || Infinity);
        const live = watching(s);
        scrub.max = String(total);
        if (!scrubbing) scrub.value = String(at);
        scrub.setAttribute("aria-valuetext", sm.clockText(at) + " of " + sm.clockText(total));
        document.getElementById("clock").textContent = sm.clockText(at) + " / " + sm.clockText(total);
        play.textContent = s.timeline.playing ? "Pause" : "Play";
        setDisabled(play, !live);
        setDisabled(scrub, !live);
      }

      function modeLine(stream) {
        return "Mode: " + stream.mode + (stream.container ? " (" + stream.container + ")" : "");
      }

      function statusText(s) {
        if (gatherFailed) return gatherFailed;
        if (s.status.error) return s.status.error;
        const sent = s.status.sent;
        if (sent) {
          const doing = sent.kind === "controls" ? "Applying changes…" : sent.kind === "seek" ? "Seeking…" : "Loading…";
          return s.status.slow ? doing + " Taking longer than usual." : doing;
        }
        if (s.status.notice === "changeFailed") return "Could not apply the change.";
        if (s.status.notice === "seekFailed") return "Could not jump to that point.";
        return s.stream ? modeLine(s.stream) : "Loading…";
      }

      function renderStatus(s) {
        const status = document.getElementById("status");
        const text = statusText(s);
        if (status.textContent !== text) status.textContent = text;
        document.getElementById("retry").hidden = !gatherFailed && !(s.status.error && s.status.life === "open");
      }

      function renderControls(s) {
        if (!ui.quality) return;
        const busy = s.status.sent != null || s.status.life !== "open";
        const r = s.remote;
        if (ui.shownRemote !== r) {
          ui.shownRemote = r;
          ui.quality.value = r.height == null ? "" : String(r.height);
          if (r.audioTrack != null) ui.audio.value = String(r.audioTrack);
          ui.subtitles.value = r.subtitle.kind === "on" ? trackToWire(r.subtitle.track) : "";
          ui.offset.value = String(r.offsetMs);
          ui.burn.checked = r.burn;
          ui.downmix.checked = r.downmix;
          ui.delivery.value = r.delivery;
        }
        if (ui.shownLocal !== s.local) {
          ui.shownLocal = s.local;
          ui.timeout.value = String(s.local.networkTimeoutS);
        }
        for (const el of ui.stream) setDisabled(el, el.dataset.never === "1" || busy);
        const burned = r.burn || (s.stream != null && s.stream.subtitleDelivery === "burned");
        ui.sizeLabel.hidden = burned;
        ui.offsetLabel.hidden = burned;
        document.getElementById("controls").setAttribute("aria-busy", busy ? "true" : "false");
      }

      function renderVolume() {
        const silent = video.muted || video.volume === 0;
        document.getElementById("mute").textContent = silent ? "Unmute" : "Mute";
        document.getElementById("volume").value = String(silent ? 0 : video.volume);
      }

      function toggleFullscreen() {
        const box = document.querySelector(".sm-player");
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
          return;
        }
        if (box.requestFullscreen) {
          box.requestFullscreen().catch(() => {});
          return;
        }
        if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      }

      function volumeSettable() {
        const kept = video.volume;
        video.volume = kept === 0.5 ? 0.25 : 0.5;
        const settable = video.volume !== kept;
        video.volume = kept;
        return settable;
      }

      function wireBar() {
        const box = document.querySelector(".sm-player");
        const scrub = document.getElementById("scrub");
        const volume = document.getElementById("volume");
        const fullscreen = document.getElementById("fullscreen");
        video.addEventListener("volumechange", renderVolume);
        video.addEventListener("click", () => runner.toggle());
        document.getElementById("play").addEventListener("click", () => runner.toggle());
        document.getElementById("retry").addEventListener("click", () => {
          if (gatherFailed) {
            location.reload();
            return;
          }
          runner.retry();
        });
        scrub.addEventListener("input", () => {
          scrubbing = true;
          renderBar(runner.state);
        });
        scrub.addEventListener("change", () => {
          scrubbing = false;
          runner.seek(parseInt(scrub.value, 10));
        });
        const settle = () =>
          setTimeout(() => {
            if (!scrubbing) return;
            scrubbing = false;
            renderBar(runner.state);
          }, 0);
        document.addEventListener("pointerup", settle);
        document.addEventListener("pointercancel", settle);
        document.getElementById("mute").addEventListener("click", () => {
          video.muted = !video.muted;
          if (!video.muted && video.volume === 0) video.volume = 1;
        });
        volume.hidden = !volumeSettable();
        volume.addEventListener("input", () => {
          video.volume = parseFloat(volume.value);
          video.muted = video.volume === 0;
        });
        fullscreen.hidden = !box.requestFullscreen && !video.webkitEnterFullscreen;
        fullscreen.addEventListener("click", toggleFullscreen);
        document.addEventListener("fullscreenchange", () => {
          fullscreen.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
        });
        renderVolume();
      }

      function holdScreen(hold) {
        awake = hold;
        if (hold) {
          acquireScreen();
          return;
        }
        const held = screenLock;
        screenLock = null;
        if (held) held.release().catch(() => {});
      }

      function acquireScreen() {
        if (screenLock && !screenLock.released) return;
        screenLock = null;
        if (!navigator.wakeLock) return;
        navigator.wakeLock
          .request("screen")
          .then((sentinel) => {
            if (awake) {
              screenLock = sentinel;
            } else {
              sentinel.release().catch(() => {});
            }
          })
          .catch(() => {});
      }

      function wireScreenLock() {
        video.addEventListener("play", () => holdScreen(true));
        video.addEventListener("pause", () => holdScreen(false));
        video.addEventListener("ended", () => holdScreen(false));
        document.addEventListener("visibilitychange", () => {
          if (awake && document.visibilityState === "visible") acquireScreen();
        });
      }

      function stopDiag() {
        if (diagTimer) {
          clearInterval(diagTimer);
          diagTimer = null;
        }
      }

      function renderDiag() {
        const box = document.getElementById("diag");
        if (!box) return;
        const stream = runner.state.stream;
        const hls = player.hls();
        const source = version && version.video && version.video[0];
        const lines = [
          "mode: " + (stream ? stream.mode : "-"),
          source
            ? "source: " + source.codec + " " + source.width + "x" + source.height + " @ " + source.frame_rate + "fps"
            : "source: -",
          "resolution: " + (video.videoWidth || 0) + "x" + (video.videoHeight || 0),
          "buffer: " + bufferedAhead(video).toFixed(1) + "s",
        ];
        if (hls) {
          lines.push(
            "bandwidth: " +
              (hls.bandwidthEstimate ? (hls.bandwidthEstimate / 1e6).toFixed(2) + " Mbps" : "n/a"),
          );
          const idx = hls.currentLevel;
          const level = idx != null && idx >= 0 && hls.levels ? hls.levels[idx] : null;
          lines.push(
            "level: " +
              (level ? level.height + "p " + Math.round(level.bitrate / 1000) + "kbps" : "auto") +
              (hls.autoLevelEnabled ? " (auto)" : ""),
          );
        } else {
          lines.push("bandwidth: n/a (native)");
          lines.push("level: native");
        }
        if (video.getVideoPlaybackQuality) {
          const q = video.getVideoPlaybackQuality();
          lines.push("frames: " + q.droppedVideoFrames + " dropped / " + q.totalVideoFrames);
        }
        box.textContent = lines.join("\n");
      }

      async function renderBreadcrumb(v) {
        const back = document.getElementById("back");
        back.textContent = "";
        if (!v || !v.title) return;
        const ref = v.title;
        const crumbs = [];
        if (ref.type === "movie") {
          crumbs.push({ label: "Movies", href: sm.url("catalog/movies.html") });
          const m = await sm.json("/api/v1/movies/" + encodeURIComponent(ref.id)).catch(() => null);
          crumbs.push({
            label: m ? m.title + (m.year ? " (" + m.year + ")" : "") : "Movie",
            href: sm.href.movie(ref.id),
          });
        } else {
          crumbs.push({ label: "Series", href: sm.url("catalog/series.html") });
          const ep = await sm
            .json("/api/v1/series/-/seasons/-/episodes/" + encodeURIComponent(ref.id))
            .catch(() => null);
          if (ep) {
            const season = await sm
              .json("/api/v1/series/-/seasons/" + encodeURIComponent(ep.season_id))
              .catch(() => null);
            const series = season
              ? await sm.json("/api/v1/series/" + encodeURIComponent(season.series_id)).catch(() => null)
              : null;
            if (series) crumbs.push({ label: series.title, href: sm.href.series(season.series_id) });
            if (season) {
              crumbs.push({
                label: season.title || "Season " + season.number,
                href: sm.href.season(season.id, season.series_id),
              });
            }
            crumbs.push({
              label: sm.episodeCode(season ? season.number : ep.season_number, ep.number),
              href: sm.href.episode(ep.id, ep.season_id, season ? season.series_id : null),
            });
          }
        }
        crumbs.push({ label: "Watch" });
        back.appendChild(sm.breadcrumbs(crumbs));
      }

      function changeRemote(fields) {
        runner.changeRemote(Object.assign({}, runner.state.remote, fields));
      }

      function buildControls() {
        const box = document.getElementById("controls");
        box.textContent = "";
        const rowTop = sm.el("div", { class: "sm-controls-row" });
        const rowMid = sm.el("div", { class: "sm-controls-row" });
        const rowBottom = sm.el("div", { class: "sm-controls-row" });
        box.appendChild(rowTop);
        box.appendChild(rowMid);
        box.appendChild(rowBottom);
        ui.stream = [];
        {
          const vid0 = (version && version.video && version.video[0]) || null;
          const originalLabel = vid0
            ? "Original, " +
              vid0.width + "x" + vid0.height + " " +
              vid0.bit_depth + "-bit " +
              (vid0.hdr ? vid0.hdr + " " : "") +
              vid0.frame_rate + "fps"
            : "Original";
          const rungs = [
            [originalLabel, ""],
            ["1080p", "1080"],
            ["720p", "720"],
            ["480p", "480"],
            ["320p", "320"],
          ];
          const select = sm.el(
            "select",
            null,
            rungs.map(([label, value]) => sm.el("option", { value }, label)),
          );
          select.addEventListener("change", () => {
            changeRemote({ height: select.value === "" ? null : parseInt(select.value, 10) });
          });
          ui.quality = select;
          ui.stream.push(select);
          rowTop.appendChild(sm.el("label", null, ["Video Quality ", select]));
        }
        {
          const audio = (version && version.audio) || [];
          const labels = audioLabels(version);
          const options = audio.length
            ? audio.map((a, i) => sm.el("option", { value: String(a.index) }, labels[i]))
            : [sm.el("option", { value: "" }, "No audio")];
          const select = sm.el("select", null, options);
          select.dataset.never = audio.length ? "" : "1";
          select.addEventListener("change", () => {
            changeRemote({ audioTrack: parseInt(select.value, 10) });
          });
          ui.audio = select;
          ui.stream.push(select);
          rowMid.appendChild(sm.el("label", null, ["Audio Track ", select]));
        }
        {
          const rates = [
            ["0.5x", "0.5"],
            ["0.75x", "0.75"],
            ["Normal", "1"],
            ["1.25x", "1.25"],
            ["1.5x", "1.5"],
            ["2x", "2"],
          ];
          const select = sm.el(
            "select",
            null,
            rates.map(([label, value]) => sm.el("option", { value }, label)),
          );
          select.value = String(video.defaultPlaybackRate || 1);
          select.addEventListener("change", () => {
            const rate = parseFloat(select.value) || 1;
            video.defaultPlaybackRate = rate;
            video.playbackRate = rate;
          });
          rowTop.appendChild(sm.el("label", null, ["Speed ", select]));
        }
        {
          const select = sm.el(
            "select",
            null,
            NETWORK_TIMEOUTS.map((seconds) => sm.el("option", { value: String(seconds) }, seconds + "s")),
          );
          select.addEventListener("change", () => {
            runner.changeLocal({ networkTimeoutS: parseInt(select.value, 10) || NETWORK_TIMEOUTS[0] });
          });
          ui.timeout = select;
          rowMid.appendChild(sm.el("label", null, ["Timeout ", select]));
        }
        {
          const select = sm.subtitleSizeSelect((size) => {
            video.dataset.subtitleSize = size;
          });
          ui.sizeLabel = sm.el("label", null, ["Subtitle size ", select]);
          rowMid.appendChild(ui.sizeLabel);
        }
        {
          const embedded = (version && version.subtitles) || [];
          const files = (version && version.subtitle_files) || [];
          const none = !embedded.length && !files.length;
          const labels = subtitleLabels(version);
          const options = [sm.el("option", { value: "" }, "No subtitles")];
          embedded.forEach((s, i) => {
            options.push(sm.el("option", { value: "embedded:" + s.index }, labels[i]));
          });
          files.forEach((f, i) => {
            options.push(sm.el("option", { value: "file:" + f.id }, labels[embedded.length + i]));
          });
          const select = sm.el("select", null, options);
          select.dataset.never = none ? "1" : "";
          select.addEventListener("change", () => {
            const track = trackFromWire(select.value);
            changeRemote({ subtitle: track ? { kind: "on", track } : { kind: "off" } });
          });
          const offset = sm.el("input", { type: "number", step: "100", class: "sm-offset" });
          offset.dataset.never = none ? "1" : "";
          offset.addEventListener("change", () => {
            changeRemote({ offsetMs: Math.round(parseFloat(offset.value) || 0) });
          });
          ui.subtitles = select;
          ui.offset = offset;
          ui.stream.push(select, offset);
          rowBottom.appendChild(sm.el("label", null, ["Subtitles ", select]));
          ui.offsetLabel = sm.el("label", null, ["Offset ", offset]);
          rowBottom.appendChild(ui.offsetLabel);
          const burn = sm.el("input", { type: "checkbox" });
          burn.addEventListener("change", () => {
            changeRemote({ burn: burn.checked });
          });
          ui.burn = burn;
          ui.stream.push(burn);
          rowBottom.appendChild(sm.el("label", null, ["Burn in ", burn]));
        }
        {
          const downmix = sm.el("input", { type: "checkbox" });
          downmix.addEventListener("change", () => {
            changeRemote({ downmix: downmix.checked });
          });
          ui.downmix = downmix;
          ui.stream.push(downmix);
          rowMid.appendChild(sm.el("label", null, ["Downmix to stereo ", downmix]));
          const diag = sm.el("input", { type: "checkbox" });
          diag.addEventListener("change", () => {
            const panel = document.getElementById("diag");
            if (diag.checked) {
              panel.hidden = false;
              renderDiag();
              stopDiag();
              diagTimer = setInterval(renderDiag, 1000);
            } else {
              panel.hidden = true;
              stopDiag();
            }
          });
          rowTop.appendChild(sm.el("label", null, ["Diagnostics ", diag]));
        }
        {
          const select = sm.el(
            "select",
            null,
            DELIVERY_MODES.map((mode) => sm.el("option", { value: mode }, mode)),
          );
          select.addEventListener("change", () => {
            changeRemote({ delivery: select.value });
          });
          ui.delivery = select;
          ui.stream.push(select);
          rowTop.appendChild(sm.el("label", null, ["Delivery ", select]));
        }
      }
    </script>
  </body>
</html>
