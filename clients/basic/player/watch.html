<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Watch</title>
  </head>
  <body>
    <nav id="nav"></nav>
    <main id="main">
      <h1 class="sm-visually-hidden">Watch</h1>
      <p id="back"></p>
      <div class="sm-player">
        <video id="player" playsinline width="960"></video>
        <pre id="diag" class="sm-diag" hidden></pre>
        <div class="sm-bar">
          <button type="button" id="play" class="sm-secondary">Play</button>
          <input type="range" id="scrub" min="0" max="0" step="1000" value="0" aria-label="Position" disabled />
          <span id="clock" class="sm-clock">0:00 / 0:00</span>
          <button type="button" id="mute" class="sm-secondary">Mute</button>
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
          <button type="button" id="fullscreen" class="sm-secondary">Fullscreen</button>
        </div>
      </div>
      <div id="controls"></div>
      <p id="status" aria-live="polite">Loading&hellip;</p>
    </main>
    <script src="../vendor/hls.min.js"></script>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      document.getElementById("player").dataset.subtitleSize = sm.subtitleSize();
      let session = null;
      let hls = null;
      let heartbeatTimer = null;
      let ended = false;
      let uid = null;
      let versionId = null;
      let versionDetail = null;
      let subtitleSizeLabel = null;
      let subtitleOffsetLabel = null;
      let diagTimer = null;
      let screenLock = null;
      let awake = false;
      const controls = { height: null, burn: false, downmix: false, delivery: "auto" };
      let selAudio = null;
      let selSub = "";
      let selOffset = 0;
      let pendingMs = null;
      let readyHandler = null;
      let originMs = 0;
      let sequential = false;
      let starting = true;
      let applying = false;
      let restarting = false;
      let scrubbing = false;
      let heldMs = 0;
      let reachMs = 0;
      let nativeSeekTimer = null;
      let busyFocus = null;
      let playbackRate = 1;
      const networkTimeouts = [10, 30, 60, 90];
      const deliveryModes = ["auto", "never", "always"];
      const timeoutKey = "shadowmask.player.network_timeout";
      let networkTimeout = loadChoice(timeoutKey, networkTimeouts, networkTimeouts[0]);

      function loadChoice(key, options, fallback) {
        let stored = null;
        try {
          stored = parseInt(localStorage.getItem(key), 10);
        } catch (_) {
          stored = null;
        }
        return options.indexOf(stored) >= 0 ? stored : fallback;
      }

      function readParams() {
        const p = new URLSearchParams(location.search);
        const asInt = (v) => (v != null && v !== "" ? parseInt(v, 10) : null);
        controls.height = asInt(p.get("height"));
        controls.burn = p.get("burn") === "1";
        controls.downmix = p.get("downmix") === "1";
        controls.delivery = deliveryModes.indexOf(p.get("delivery")) > 0 ? p.get("delivery") : "auto";
        selAudio = p.has("audio") ? asInt(p.get("audio")) : null;
        selSub = p.get("sub") || "";
        selOffset = asInt(p.get("offset")) || 0;
      }

      function writeParams() {
        const p = new URLSearchParams();
        p.set("version", versionId);
        if (controls.height != null) p.set("height", String(controls.height));
        if (controls.burn) p.set("burn", "1");
        if (controls.downmix) p.set("downmix", "1");
        if (controls.delivery !== "auto") p.set("delivery", controls.delivery);
        if (selAudio != null) p.set("audio", String(selAudio));
        if (selSub) p.set("sub", selSub);
        if (selOffset) p.set("offset", String(selOffset));
        history.replaceState(null, "", location.pathname + "?" + p.toString());
      }

      function parseSubValue(value) {
        if (!value) return null;
        const sep = value.indexOf(":");
        const kind = value.slice(0, sep);
        const key = value.slice(sep + 1);
        return kind === "embedded"
          ? { type: "embedded", index: parseInt(key, 10) }
          : { type: "file", id: key };
      }

      if (sm.requireAuth()) start();

      async function start() {
        const status = document.getElementById("status");
        versionId = sm.qs("version");
        if (!versionId) {
          status.textContent = "No version specified.";
          return;
        }
        readParams();
        try {
          const me = await sm.self();
          uid = me.id;
          const info = await sm.json("/api/v1/server/info").catch(() => ({ profile_version: 1 }));
          const resume = await sm
            .json("/api/v1/users/" + encodeURIComponent(uid) + "/progress/" + encodeURIComponent(versionId))
            .catch(() => null);
          const startPos = resume && resume.position_ms ? resume.position_ms : 0;
          session = await sm.json("/api/v1/sessions", {
            method: "POST",
            body: JSON.stringify(
              Object.assign(
                {
                  version_id: versionId,
                  start_position_ms: startPos,
                  capabilities: { platform: clientPlatform(), profile_version: info.profile_version || 1 },
                },
                controls.delivery !== "auto" ? { delivery: controls.delivery } : {},
              ),
            ),
          });
          window.addEventListener("pagehide", endSession);
          window.addEventListener("pageshow", (e) => {
            if (e.persisted && ended) location.reload();
          });
          originMs = session.origin_ms || 0;
          sequential = session.sequential === true;
          status.textContent = modeLine(session);
          await attach(session.manifest_url, session.mode, startPos - originMs);
          wireBar();
          startHeartbeat(session.heartbeat_interval_s || 10);
          wirePlaybackProgress();
          wireScreenLock();
          await buildControls();
          renderBar();
          await applyInitialParams();
        } catch (err) {
          if (!heartbeatTimer) endSession();
          status.textContent = "Could not start playback (" + err.message + ").";
        } finally {
          starting = false;
          document.getElementById("scrub").disabled = !session || ended;
        }
      }

      function modeLine(s) {
        return "Mode: " + s.mode + (s.container ? " (" + s.container + ")" : "");
      }

      function autostart(video) {
        video.defaultPlaybackRate = playbackRate;
        video.playbackRate = playbackRate;
        const started = video.play();
        if (started && started.catch) {
          started.catch(() => {
            video.muted = true;
            video.play().catch(() => {});
          });
        }
      }

      async function attach(url, mode, positionMs) {
        const video = document.getElementById("player");
        pendingMs = originMs + positionMs;
        if (readyHandler) video.removeEventListener("loadedmetadata", readyHandler);
        readyHandler = null;
        teardownHls();
        if (mode === "direct") {
          video.src = url;
          seekOnReady(video, positionMs);
          return;
        }
        if (window.Hls && window.Hls.isSupported()) {
          const wait = networkTimeout * 1000;
          hls = new window.Hls({
            manifestLoadingTimeOut: wait,
            levelLoadingTimeOut: wait,
            fragLoadingTimeOut: wait,
          });
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
            if (positionMs) seekLocal(video, positionMs);
            pendingMs = null;
            autostart(video);
          });
          hls.on(window.Hls.Events.FRAG_BUFFERED, renderBar);
          return;
        }
        if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = url;
          seekOnReady(video, positionMs);
          return;
        }
        document.getElementById("status").textContent =
          "This browser needs clients/basic/vendor/hls.min.js for HLS playback, or native HLS support. Mode: " +
          mode;
      }

      function seekOnReady(video, positionMs) {
        readyHandler = () => {
          readyHandler = null;
          if (positionMs) seekLocal(video, positionMs);
          pendingMs = null;
          autostart(video);
        };
        video.addEventListener("loadedmetadata", readyHandler, { once: true });
      }

      function titleMs(video) {
        if (pendingMs != null) return pendingMs;
        return originMs + Math.floor(video.currentTime * 1000);
      }

      function fullMs(video) {
        const known = versionDetail && versionDetail.duration_ms;
        if (known > 0) return known;
        return Number.isFinite(video.duration) ? originMs + Math.floor(video.duration * 1000) : 0;
      }

      function producedMs(video) {
        return Math.floor((video.currentTime + bufferedAhead(video)) * 1000) + 30000;
      }

      function seekLocal(video, localMs) {
        reachMs = Math.max(producedMs(video), localMs);
        video.currentTime = localMs / 1000;
      }

      function seekTimeline(targetMs) {
        const video = document.getElementById("player");
        if (!sequential) {
          seekLocal(video, targetMs);
          return;
        }
        const local = targetMs - originMs;
        if (local >= 0 && local <= producedMs(video)) {
          seekLocal(video, local);
          return;
        }
        restartAt(targetMs);
      }

      function renderBar() {
        const video = document.getElementById("player");
        const scrub = document.getElementById("scrub");
        const total = fullMs(video);
        const playing = restarting ? heldMs : titleMs(video);
        const at = scrubbing ? parseInt(scrub.value, 10) : Math.min(playing, total || Infinity);
        if (!video.seeking) reachMs = producedMs(video);
        scrub.max = String(total);
        if (!scrubbing) scrub.value = String(at);
        scrub.setAttribute("aria-valuetext", sm.clockText(at) + " of " + sm.clockText(total));
        document.getElementById("clock").textContent = sm.clockText(at) + " / " + sm.clockText(total);
        document.getElementById("play").textContent = video.paused ? "Play" : "Pause";
      }

      function renderVolume() {
        const video = document.getElementById("player");
        const silent = video.muted || video.volume === 0;
        document.getElementById("mute").textContent = silent ? "Unmute" : "Mute";
        document.getElementById("volume").value = String(silent ? 0 : video.volume);
      }

      function togglePlay() {
        if (applying || restarting) return;
        const video = document.getElementById("player");
        if (video.ended && sequential && originMs > 0) {
          restartAt(0);
          return;
        }
        if (video.paused) {
          video.play().catch(() => {});
          return;
        }
        video.pause();
      }

      function toggleFullscreen() {
        const box = document.querySelector(".sm-player");
        const video = document.getElementById("player");
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
          return;
        }
        if (box.requestFullscreen) {
          box.requestFullscreen().catch(() => {});
          return;
        }
        if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      }

      function volumeSettable(video) {
        const kept = video.volume;
        video.volume = kept === 0.5 ? 0.25 : 0.5;
        const settable = video.volume !== kept;
        video.volume = kept;
        return settable;
      }

      function wireBar() {
        const video = document.getElementById("player");
        const box = document.querySelector(".sm-player");
        const scrub = document.getElementById("scrub");
        const volume = document.getElementById("volume");
        const fullscreen = document.getElementById("fullscreen");
        for (const name of ["timeupdate", "durationchange", "loadedmetadata", "play", "pause", "ended", "emptied", "progress"]) {
          video.addEventListener(name, renderBar);
        }
        video.addEventListener("seeking", () => {
          if (!sequential || restarting || applying) return;
          clearTimeout(nativeSeekTimer);
          const local = Math.floor(video.currentTime * 1000);
          if (local <= reachMs) return;
          const target = originMs + local;
          nativeSeekTimer = setTimeout(() => restartAt(target), 300);
        });
        video.addEventListener("volumechange", renderVolume);
        video.addEventListener("click", togglePlay);
        document.getElementById("play").addEventListener("click", togglePlay);
        scrub.addEventListener("input", () => {
          scrubbing = true;
          renderBar();
        });
        scrub.addEventListener("change", () => {
          scrubbing = false;
          seekTimeline(parseInt(scrub.value, 10));
        });
        const settle = () =>
          setTimeout(() => {
            if (!scrubbing) return;
            scrubbing = false;
            renderBar();
          }, 0);
        document.addEventListener("pointerup", settle);
        document.addEventListener("pointercancel", settle);
        document.getElementById("mute").addEventListener("click", () => {
          video.muted = !video.muted;
          if (!video.muted && video.volume === 0) video.volume = 1;
        });
        volume.hidden = !volumeSettable(video);
        volume.addEventListener("input", () => {
          video.volume = parseFloat(volume.value);
          video.muted = video.volume === 0;
        });
        fullscreen.hidden = !box.requestFullscreen && !video.webkitEnterFullscreen;
        fullscreen.addEventListener("click", toggleFullscreen);
        document.addEventListener("fullscreenchange", () => {
          fullscreen.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
        });
        renderBar();
        renderVolume();
      }

      async function restartAt(timelineMs) {
        if (!session || ended || starting || restarting || applying) return;
        restarting = true;
        setControlsBusy(true);
        heldMs = timelineMs;
        renderBar();
        try {
          const r = await sm.json(
            "/api/v1/sessions/" + encodeURIComponent(session.session_id) + "/seek",
            { method: "POST", body: JSON.stringify({ position_ms: timelineMs }) },
          );
          session.manifest_url = r.manifest_url;
          session.mode = r.mode;
          originMs = r.origin_ms || 0;
          sequential = r.sequential === true;
          await attach(r.manifest_url, r.mode, timelineMs - originMs);
        } catch (err) {
          document.getElementById("status").textContent = "Could not seek there (" + err.message + ").";
        } finally {
          restarting = false;
          setControlsBusy(false);
          renderBar();
        }
      }

      function teardownHls() {
        if (hls) {
          hls.destroy();
          hls = null;
        }
      }

      function sendProgress(stateOverride) {
        if (!session || ended) return;
        const video = document.getElementById("player");
        const state = stateOverride || (video.paused ? "paused" : "playing");
        sm
          .api("/api/v1/sessions/" + encodeURIComponent(session.session_id) + "/progress", {
            method: "POST",
            body: JSON.stringify({
              position_ms: titleMs(video),
              state,
            }),
          })
          .catch(() => {});
      }

      function wirePlaybackProgress() {
        const video = document.getElementById("player");
        video.addEventListener("playing", () => sendProgress("playing"));
        video.addEventListener("pause", () => sendProgress("paused"));
        video.addEventListener("ended", () => sendProgress("playing"));
      }

      function clientPlatform() {
        const agent = navigator.userAgent;
        if (agent.includes("Chrome/") || agent.includes("Chromium/")) return "chrome";
        if (agent.includes("Firefox/")) return "firefox";
        if (agent.includes("Safari/")) return "safari";
        return "generic";
      }

      function holdScreen(hold) {
        awake = hold;
        if (hold) {
          acquireScreen();
          return;
        }
        const held = screenLock;
        screenLock = null;
        if (held) held.release().catch(() => {});
      }

      function acquireScreen() {
        if (screenLock && !screenLock.released) return;
        screenLock = null;
        if (!navigator.wakeLock) return;
        navigator.wakeLock
          .request("screen")
          .then((sentinel) => {
            if (awake) {
              screenLock = sentinel;
            } else {
              sentinel.release().catch(() => {});
            }
          })
          .catch(() => {});
      }

      function wireScreenLock() {
        const video = document.getElementById("player");
        video.addEventListener("play", () => holdScreen(true));
        video.addEventListener("pause", () => holdScreen(false));
        video.addEventListener("ended", () => holdScreen(false));
        document.addEventListener("visibilitychange", () => {
          if (awake && document.visibilityState === "visible") acquireScreen();
        });
      }

      function startHeartbeat(intervalS) {
        stopHeartbeat();
        heartbeatTimer = setInterval(() => sendProgress(), Math.max(1, intervalS) * 1000);
      }

      function stopHeartbeat() {
        if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }
      }

      function stopDiag() {
        if (diagTimer) {
          clearInterval(diagTimer);
          diagTimer = null;
        }
      }

      function bufferedAhead(video) {
        const ranges = video.buffered;
        const at = video.currentTime;
        for (let i = 0; i < ranges.length; i++) {
          if (at >= ranges.start(i) - 0.5 && at <= ranges.end(i)) {
            return Math.max(0, ranges.end(i) - at);
          }
        }
        return 0;
      }

      function renderDiag() {
        const box = document.getElementById("diag");
        if (!box) return;
        const video = document.getElementById("player");
        const source = versionDetail && versionDetail.video && versionDetail.video[0];
        const lines = [
          "mode: " + (session ? session.mode : "-"),
          source
            ? "source: " + source.codec + " " + source.width + "x" + source.height + " @ " + source.frame_rate + "fps"
            : "source: -",
          "resolution: " + (video.videoWidth || 0) + "x" + (video.videoHeight || 0),
          "buffer: " + bufferedAhead(video).toFixed(1) + "s",
        ];
        if (hls) {
          lines.push(
            "bandwidth: " +
              (hls.bandwidthEstimate ? (hls.bandwidthEstimate / 1e6).toFixed(2) + " Mbps" : "n/a"),
          );
          const idx = hls.currentLevel;
          const level = idx != null && idx >= 0 && hls.levels ? hls.levels[idx] : null;
          lines.push(
            "level: " +
              (level ? level.height + "p " + Math.round(level.bitrate / 1000) + "kbps" : "auto") +
              (hls.autoLevelEnabled ? " (auto)" : ""),
          );
        } else {
          lines.push("bandwidth: n/a (native)");
          lines.push("level: native");
        }
        if (video.getVideoPlaybackQuality) {
          const q = video.getVideoPlaybackQuality();
          lines.push("frames: " + q.droppedVideoFrames + " dropped / " + q.totalVideoFrames);
        }
        box.textContent = lines.join("\n");
      }

      function endSession() {
        if (ended || !session) return;
        ended = true;
        stopHeartbeat();
        stopDiag();
        holdScreen(false);
        const t = sm.tokens();
        const token = t && t.access_token;
        fetch("/api/v1/sessions/" + encodeURIComponent(session.session_id), {
          method: "DELETE",
          headers: token ? { Authorization: "Bearer " + token } : {},
          keepalive: true,
        }).catch(() => {});
      }

      function sendUpdate(extra, forcedPositionMs) {
        return renegotiate(
          "/update",
          Object.assign(
            {
              target_height: controls.height,
              force_burn: controls.burn,
              downmix_stereo: controls.downmix,
            },
            controls.delivery !== "auto" ? { delivery: controls.delivery } : {},
            extra || {},
          ),
          forcedPositionMs,
        );
      }

      async function applyInitialParams() {
        const hasParams =
          controls.height != null ||
          controls.burn ||
          controls.downmix ||
          controls.delivery !== "auto" ||
          selAudio != null ||
          selSub !== "";
        if (!hasParams) return;
        const extra = {};
        if (selAudio != null) extra.audio_track = selAudio;
        const track = parseSubValue(selSub);
        if (track) {
          extra.subtitle = { action: "set", track, offset_ms: selOffset || null };
        }
        await sendUpdate(extra);
      }

      function setControlsBusy(busy) {
        const root = document.getElementById("controls");
        if (!root) return;
        root.setAttribute("aria-busy", busy ? "true" : "false");
        const bar = [document.getElementById("play"), document.getElementById("scrub")];
        for (const el of [...root.querySelectorAll("select, input, button"), ...bar]) {
          if (busy) {
            if (el === document.activeElement) busyFocus = el;
            el.dataset.wasDisabled = el.disabled ? "1" : "";
            el.disabled = true;
          } else if (el.dataset.wasDisabled !== undefined) {
            el.disabled = el.dataset.wasDisabled === "1";
            delete el.dataset.wasDisabled;
          }
        }
        if (!busy && busyFocus) {
          const now = document.activeElement;
          if (!now || now === document.body || now === busyFocus) busyFocus.focus({ preventScroll: true });
          busyFocus = null;
        }
      }

      async function renegotiate(suffix, body, forcedPositionMs) {
        if (!session || ended || applying || restarting) return;
        const video = document.getElementById("player");
        const keepPos = forcedPositionMs != null ? forcedPositionMs : titleMs(video);
        const wasPlaying = !video.paused;
        video.pause();
        applying = true;
        setControlsBusy(true);
        document.getElementById("status").textContent = "Applying changes…";
        try {
          const r = await sm.json(
            "/api/v1/sessions/" + encodeURIComponent(session.session_id) + suffix,
            { method: "POST", body: JSON.stringify(Object.assign({}, body, { position_ms: keepPos })) },
          );
          session.manifest_url = r.manifest_url;
          session.mode = r.mode;
          session.selected = r.selected;
          syncBurnedSubtitles();
          originMs = r.origin_ms || 0;
          sequential = r.sequential === true;
          document.getElementById("status").textContent = modeLine(r);
          await attach(r.manifest_url, r.mode, keepPos - originMs);
        } catch (err) {
          document.getElementById("status").textContent = "Renegotiation failed (" + err.message + ").";
          if (wasPlaying) autostart(video);
        } finally {
          applying = false;
          setControlsBusy(false);
        }
      }

      async function renderBreadcrumb(v) {
        const back = document.getElementById("back");
        back.textContent = "";
        if (!v || !v.title) return;
        const ref = v.title;
        const crumbs = [];
        if (ref.type === "movie") {
          crumbs.push({ label: "Movies", href: sm.url("catalog/movies.html") });
          const m = await sm.json("/api/v1/movies/" + encodeURIComponent(ref.id)).catch(() => null);
          crumbs.push({
            label: m ? m.title + (m.year ? " (" + m.year + ")" : "") : "Movie",
            href: sm.href.movie(ref.id),
          });
        } else {
          crumbs.push({ label: "Series", href: sm.url("catalog/series.html") });
          const ep = await sm
            .json("/api/v1/series/-/seasons/-/episodes/" + encodeURIComponent(ref.id))
            .catch(() => null);
          if (ep) {
            const season = await sm
              .json("/api/v1/series/-/seasons/" + encodeURIComponent(ep.season_id))
              .catch(() => null);
            const series = season
              ? await sm.json("/api/v1/series/" + encodeURIComponent(season.series_id)).catch(() => null)
              : null;
            if (series) crumbs.push({ label: series.title, href: sm.href.series(season.series_id) });
            if (season) {
              crumbs.push({
                label: season.title || "Season " + season.number,
                href: sm.href.season(season.id, season.series_id),
              });
            }
            crumbs.push({
              label: sm.episodeCode(season ? season.number : ep.season_number, ep.number),
              href: sm.href.episode(ep.id, ep.season_id, season ? season.series_id : null),
            });
          }
        }
        crumbs.push({ label: "Watch" });
        back.appendChild(sm.breadcrumbs(crumbs));
      }

      function syncBurnedSubtitles() {
        const delivery = session && session.selected && session.selected.subtitle_delivery;
        const burned = controls.burn || delivery === "burned";
        if (subtitleSizeLabel) subtitleSizeLabel.hidden = burned;
        if (subtitleOffsetLabel) subtitleOffsetLabel.hidden = burned;
      }

      async function buildControls() {
        const box = document.getElementById("controls");
        box.textContent = "";
        const version = await sm
          .json("/api/v1/versions/" + encodeURIComponent(versionId))
          .catch(() => null);
        versionDetail = version;
        renderBreadcrumb(version);
        const rowTop = sm.el("div", { class: "sm-controls-row" });
        const rowMid = sm.el("div", { class: "sm-controls-row" });
        const rowBottom = sm.el("div", { class: "sm-controls-row" });
        box.appendChild(rowTop);
        box.appendChild(rowMid);
        box.appendChild(rowBottom);
        {
          const vid0 = (version && version.video && version.video[0]) || null;
          const originalLabel = vid0
            ? "Original, " +
              vid0.width + "x" + vid0.height + " " +
              vid0.bit_depth + "-bit " +
              (vid0.hdr ? vid0.hdr + " " : "") +
              vid0.frame_rate + "fps"
            : "Original";
          const rungs = [
            [originalLabel, ""],
            ["1080p", "1080"],
            ["720p", "720"],
            ["480p", "480"],
            ["320p", "320"],
          ];
          const select = sm.el(
            "select",
            null,
            rungs.map(([label, value]) => sm.el("option", { value }, label)),
          );
          select.value = controls.height == null ? "" : String(controls.height);
          select.addEventListener("change", () => {
            controls.height = select.value === "" ? null : parseInt(select.value, 10);
            writeParams();
            sendUpdate({});
          });
          rowTop.appendChild(sm.el("label", null, ["Video Quality ", select]));
        }
        {
          const audio = (version && version.audio) || [];
          const options = audio.length
            ? audio.map((a) =>
                sm.el(
                  "option",
                  { value: String(a.index) },
                  "Audio " + a.index + " " + a.codec + (a.language ? " " + sm.lang(a.language) : ""),
                ),
              )
            : [sm.el("option", { value: "" }, "No audio")];
          const select = sm.el("select", null, options);
          if (!audio.length) select.disabled = true;
          if (selAudio != null) {
            select.value = String(selAudio);
          } else if (session.selected && session.selected.audio_track != null) {
            select.value = String(session.selected.audio_track);
          }
          select.addEventListener("change", () => {
            selAudio = parseInt(select.value, 10);
            writeParams();
            sendUpdate({ audio_track: selAudio });
          });
          rowMid.appendChild(sm.el("label", null, ["Audio Track ", select]));
        }
        {
          const rates = [
            ["0.5x", "0.5"],
            ["0.75x", "0.75"],
            ["Normal", "1"],
            ["1.25x", "1.25"],
            ["1.5x", "1.5"],
            ["2x", "2"],
          ];
          const select = sm.el(
            "select",
            null,
            rates.map(([label, value]) => sm.el("option", { value }, label)),
          );
          select.value = String(playbackRate);
          select.addEventListener("change", () => {
            playbackRate = parseFloat(select.value) || 1;
            const video = document.getElementById("player");
            video.defaultPlaybackRate = playbackRate;
            video.playbackRate = playbackRate;
          });
          rowTop.appendChild(sm.el("label", null, ["Speed ", select]));
        }
        {
          const select = sm.el(
            "select",
            null,
            networkTimeouts.map((seconds) =>
              sm.el("option", { value: String(seconds) }, seconds + "s"),
            ),
          );
          select.value = String(networkTimeout);
          select.addEventListener("change", () => {
            networkTimeout = parseInt(select.value, 10) || networkTimeouts[0];
            try {
              localStorage.setItem(timeoutKey, String(networkTimeout));
            } catch (_) {}
            if (!session) return;
            const video = document.getElementById("player");
            attach(session.manifest_url, session.mode, titleMs(video) - originMs);
          });
          rowMid.appendChild(sm.el("label", null, ["Timeout ", select]));
        }
        {
          const video = document.getElementById("player");
          const select = sm.subtitleSizeSelect((size) => {
            video.dataset.subtitleSize = size;
          });
          subtitleSizeLabel = sm.el("label", null, ["Subtitle size ", select]);
          rowMid.appendChild(subtitleSizeLabel);
        }
        {
          const embedded = (version && version.subtitles) || [];
          const files = (version && version.subtitle_files) || [];
          const options = [sm.el("option", { value: "" }, "No subtitles")];
          embedded.forEach((s) => {
            options.push(
              sm.el(
                "option",
                { value: "embedded:" + s.index },
                "Sub " + s.index + " " + s.format + (s.language ? " " + sm.lang(s.language) : ""),
              ),
            );
          });
          files.forEach((f) => {
            options.push(
              sm.el(
                "option",
                { value: "file:" + f.id },
                sm.lang(f.language) + " " + f.format + " (" + f.source + ")",
              ),
            );
          });
          const select = sm.el("select", null, options);
          if (!embedded.length && !files.length) select.disabled = true;
          const selected = session.selected && session.selected.subtitle_track;
          if (selSub) {
            select.value = selSub;
          } else if (selected && selected.type === "embedded") {
            select.value = "embedded:" + selected.index;
          } else if (selected && selected.type === "file") {
            select.value = "file:" + selected.id;
          }
          const offsetInput = sm.el("input", {
            type: "number",
            step: "100",
            value: String(selOffset),
            class: "sm-offset",
          });
          offsetInput.disabled = !embedded.length && !files.length;
          const trackOf = () => parseSubValue(select.value);
          select.addEventListener("change", () => {
            selSub = select.value;
            writeParams();
            const track = trackOf();
            if (!track) {
              sendUpdate({ subtitle: { action: "disable" } });
            } else {
              sendUpdate({ subtitle: { action: "set", track: track, offset_ms: selOffset || null } });
            }
          });
          offsetInput.addEventListener("change", () => {
            selOffset = Math.round(parseFloat(offsetInput.value) || 0);
            writeParams();
            const track = trackOf();
            if (!track) return;
            sendUpdate({
              subtitle: {
                action: "set",
                track: track,
                offset_ms: selOffset,
              },
            });
          });
          rowBottom.appendChild(sm.el("label", null, ["Subtitles ", select]));
          subtitleOffsetLabel = sm.el("label", null, ["Offset ", offsetInput]);
          rowBottom.appendChild(subtitleOffsetLabel);
          syncBurnedSubtitles();
          const burn = sm.el("input", { type: "checkbox" });
          burn.checked = controls.burn;
          burn.addEventListener("change", () => {
            controls.burn = burn.checked;
            syncBurnedSubtitles();
            writeParams();
            sendUpdate({});
          });
          rowBottom.appendChild(sm.el("label", null, ["Burn in ", burn]));
        }
        {
          const downmix = sm.el("input", { type: "checkbox" });
          downmix.checked = controls.downmix;
          downmix.addEventListener("change", () => {
            controls.downmix = downmix.checked;
            writeParams();
            sendUpdate({});
          });
          rowMid.appendChild(sm.el("label", null, ["Downmix to stereo ", downmix]));
          const diag = sm.el("input", { type: "checkbox" });
          diag.addEventListener("change", () => {
            const panel = document.getElementById("diag");
            if (diag.checked) {
              panel.hidden = false;
              renderDiag();
              stopDiag();
              diagTimer = setInterval(renderDiag, 1000);
            } else {
              panel.hidden = true;
              stopDiag();
            }
          });
          rowTop.appendChild(sm.el("label", null, ["Diagnostics ", diag]));
        }
        {
          const select = sm.el(
            "select",
            null,
            deliveryModes.map((mode) => sm.el("option", { value: mode }, mode)),
          );
          select.value = controls.delivery;
          select.addEventListener("change", () => {
            controls.delivery = select.value;
            writeParams();
            sendUpdate({});
          });
          rowTop.appendChild(sm.el("label", null, ["Delivery ", select]));
        }
      }
    </script>
  </body>
</html>
