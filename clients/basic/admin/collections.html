<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Admin collections</title>
  </head>
  <body>
    <h1 class="sm-visually-hidden">Collections</h1>
    <nav id="nav"></nav>
    <p class="sm-crumbs"><a href="index.html">Admin</a> / Collections</p>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      const eu = encodeURIComponent;
      let listContainer = null;
      let heading = null;

      if (sm.requireAuth()) guard();

      async function guard() {
        const main = document.getElementById("main");
        try {
          const me = await sm.self();
          if (me.role !== "admin") {
            main.textContent = "Not Authorized.";
            return;
          }
          main.textContent = "";
          const create = sm.el("button", { type: "button" }, "Create collection");
          create.addEventListener("click", () =>
            sm.openDialog("Create collection", (box) => createCollectionBody(box)),
          );
          main.appendChild(sm.el("p", null, create));
          heading = sm.el("h2", { text: "Collections" });
          main.appendChild(heading);
          listContainer = sm.el("div", null);
          main.appendChild(listContainer);
          await loadList();
        } catch (err) {
          main.textContent = "Could not load.";
        }
      }

      function createCollectionBody(box) {
        const name = sm.el("input", { autocomplete: "off" });
        const overview = sm.el("input", { autocomplete: "off" });
        const status = sm.el("span", null);
        const submit = sm.el("button", { type: "submit" }, "Create");
        const form = sm.el("form", null, [
          sm.el("label", null, ["Name ", name]),
          sm.el("br"),
          sm.el("label", null, ["Overview ", overview]),
          sm.el("br"),
          submit,
          " ",
          status,
        ]);
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!name.value) {
            status.textContent = "Name is required.";
            return;
          }
          submit.disabled = true;
          try {
            await sm.json("/api/v1/movies/collections", {
              method: "POST",
              body: JSON.stringify({ name: name.value, overview: overview.value || null, movies: [] }),
            });
            sm.toast("Collection created.", "ok");
            box.close();
            await loadList();
          } catch (err) {
            sm.toast("Create failed.", "danger");
            submit.disabled = false;
          }
        });
        return form;
      }

      async function loadList() {
        listContainer.textContent = "Loading…";
        try {
          const page = await sm.json("/api/v1/movies/collections");
          heading.textContent = "Collections (" + page.total + ")";
          listContainer.textContent = "";
          if (!page.items.length) {
            listContainer.appendChild(sm.el("p", { text: "No collections found." }));
            return;
          }
          const rows = page.items.map((c) => {
            const edit = sm.el("button", { type: "button" }, "Edit");
            edit.addEventListener("click", () =>
              sm.openDialog("Edit collection: " + c.name, (box) => collectionEditBody(box, c)),
            );
            const del = sm.el("button", { type: "button", class: "sm-danger" }, "Delete");
            del.addEventListener("click", async () => {
              if (!confirm("Delete collection " + c.name + "?")) return;
              try {
                await sm.json("/api/v1/movies/collections/" + eu(c.id), { method: "DELETE" });
                sm.toast("Collection deleted.", "ok");
              } catch (err) {
                sm.toast("Delete failed.", "danger");
              }
              await loadList();
            });
            return [
              sm.el("a", { href: sm.href.collection(c.id) }, c.name),
              c.overview || "",
              String(c.movies.length),
              [edit, " ", del],
            ];
          });
          listContainer.appendChild(sm.table(["Name", "Overview", "Movies", ""], rows));
        } catch (err) {
          listContainer.textContent = "Could not load collections.";
        }
      }

      function collectionEditBody(box, c) {
        const container = sm.el("div", null);
        let movies = c.movies.slice();
        const name = sm.el("input", { value: c.name });
        const overview = sm.el("input", { value: c.overview || "" });
        const membersBox = sm.el("div", null);
        const status = sm.el("span", null);
        const searchInput = sm.el("input", { placeholder: "Search movies", autocomplete: "off" });
        const searchResults = sm.el("div", null);

        async function persist() {
          await sm.json("/api/v1/movies/collections/" + eu(c.id), {
            method: "PUT",
            body: JSON.stringify({ name: name.value, overview: overview.value || null, movies }),
          });
        }

        async function renderMembers() {
          if (!movies.length) {
            membersBox.textContent = "";
            membersBox.appendChild(sm.el("p", { text: "No movies in this collection." }));
            return;
          }
          membersBox.textContent = "Loading…";
          let cards = [];
          try {
            cards = await sm.json("/api/v1/titles/batch", {
              method: "POST",
              body: JSON.stringify({ titles: movies.map((id) => ({ type: "movie", id })) }),
            });
          } catch (e) {
            cards = [];
          }
          const byId = {};
          cards.forEach((m) => {
            byId[m.id] = m;
          });
          const rows = movies.map((id) => {
            const m = byId[id];
            const label = m ? m.title + (m.year ? " (" + m.year + ")" : "") : id;
            const remove = sm.el("button", { type: "button", class: "sm-danger" }, "Remove");
            remove.addEventListener("click", async () => {
              movies = movies.filter((x) => x !== id);
              try {
                await persist();
                sm.toast("Removed.", "ok");
              } catch (e) {
                sm.toast("Remove failed.", "danger");
              }
              await renderMembers();
              await loadList();
            });
            return [label, id, remove];
          });
          membersBox.textContent = "";
          membersBox.appendChild(sm.table(["Movie", "Id", ""], rows));
        }

        const searchForm = sm.el("form", null, [
          sm.el("label", null, ["Add a movie ", searchInput]),
          " ",
          sm.el("button", { type: "submit" }, "Search"),
        ]);
        searchForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const q = searchInput.value.trim();
          if (!q) return;
          searchResults.textContent = "Searching...";
          try {
            const page = await sm.json(
              "/api/v1/search?" + new URLSearchParams({ q, type: "movie" }).toString(),
            );
            const results = (page.items || []).filter((r) => r.type === "movie");
            searchResults.textContent = "";
            if (!results.length) {
              searchResults.appendChild(sm.el("p", { text: "No matches." }));
              return;
            }
            const rows = results.map((r) => {
              const pick = sm.el("button", { type: "button" }, "Add");
              if (movies.includes(r.id)) {
                pick.textContent = "Added";
                pick.setAttribute("disabled", "disabled");
              }
              pick.addEventListener("click", async () => {
                if (movies.includes(r.id)) return;
                movies.push(r.id);
                pick.textContent = "Added";
                pick.setAttribute("disabled", "disabled");
                try {
                  await persist();
                  sm.toast("Added.", "ok");
                } catch (e) {
                  sm.toast("Add failed.", "danger");
                }
                await renderMembers();
                await loadList();
              });
              return [r.title, r.year ? String(r.year) : "", r.id, pick];
            });
            searchResults.appendChild(sm.table(["Match", "Year", "Id", ""], rows));
          } catch (err) {
            searchResults.textContent = "Search failed.";
          }
        });
        const save = sm.el("button", { type: "button" }, "Save name and overview");
        save.addEventListener("click", async () => {
          save.disabled = true;
          try {
            await persist();
            sm.toast("Collection saved.", "ok");
            box.close();
            await loadList();
          } catch (err) {
            sm.toast("Save failed.", "danger");
            save.disabled = false;
          }
        });

        container.appendChild(sm.el("p", null, sm.el("label", null, ["Name ", name])));
        container.appendChild(sm.el("p", null, sm.el("label", null, ["Overview ", overview])));
        container.appendChild(
          sm.el("p", null, sm.el("strong", { text: "Movies (added or removed immediately)" })),
        );
        container.appendChild(membersBox);
        container.appendChild(searchForm);
        container.appendChild(searchResults);
        container.appendChild(sm.el("p", null, [save, " ", status]));
        renderMembers();
        return container;
      }
    </script>
  </body>
</html>
