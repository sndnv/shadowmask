<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Job</title>
  </head>
  <body>
    <h1 class="sm-visually-hidden">Job</h1>
    <nav id="nav"></nav>
    <p class="sm-crumbs">
      <a href="index.html">Admin</a> / <a href="jobs.html">Jobs</a> /
      <span id="crumb"></span>
    </p>
    <p><button type="button" id="refresh">Refresh</button></p>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      const id = sm.qs("id");
      let currentLevel = "info";

      if (sm.requireAuth()) guard();

      async function guard() {
        const main = document.getElementById("main");
        if (!id) {
          main.textContent = "Unknown job.";
          return;
        }
        document.getElementById("crumb").textContent = id;
        try {
          const me = await sm.self();
          if (me.role !== "admin") {
            main.textContent = "Not Authorized.";
            return;
          }
          document.getElementById("refresh").addEventListener("click", load);
          await load();
        } catch (err) {
          main.textContent = "Could not load.";
        }
      }

      async function load() {
        const main = document.getElementById("main");
        main.textContent = "Loading…";
        try {
          const job = await sm.json("/api/v1/admin/jobs/" + encodeURIComponent(id));
          main.textContent = "";

          const facts = (pairs) => {
            const row = sm.el("div", { class: "sm-facts" });
            pairs.forEach(([key, value]) => {
              if (value === null || value === undefined || value === "") return;
              row.appendChild(sm.el("span", null, [sm.el("strong", { text: key + ": " }), value]));
            });
            return row;
          };
          const parentLink = job.parent_id
            ? sm.el("a", { href: "job.html?id=" + encodeURIComponent(job.parent_id) }, job.parent_id)
            : null;
          main.appendChild(
            facts([
              ["Kind", job.kind],
              ["Parent", parentLink],
              ["Status", job.status],
              ["Priority", job.priority],
              ["Progress", Math.round(job.progress * 100) + "%"],
              ["Attempts", String(job.attempts)],
            ]),
          );
          main.appendChild(
            facts([
              ["Created", sm.time(job.created_at)],
              ["Updated", sm.time(job.updated_at)],
              ["Started", sm.time(job.started_at)],
              ["Finished", sm.time(job.finished_at)],
            ]),
          );
          if (job.last_error) {
            main.appendChild(
              sm.el("p", { class: "sm-status" }, [
                sm.el("strong", { text: "Error: " }),
                job.last_error,
              ]),
            );
          }

          const logHost = sm.el("div");
          const level = sm.el("select", null, [
            sm.el("option", { value: "debug" }, "Debug"),
            sm.el("option", { value: "info" }, "Info"),
            sm.el("option", { value: "warn" }, "Warn"),
            sm.el("option", { value: "error" }, "Error"),
          ]);
          level.value = currentLevel;
          level.addEventListener("change", () => {
            currentLevel = level.value;
            loadLogs(logHost, currentLevel);
          });
          const wipe = sm.el("button", { type: "button" }, "Wipe logs");
          wipe.addEventListener("click", async () => {
            if (!confirm("Wipe all logs for this job? This cannot be undone.")) return;
            wipe.disabled = true;
            try {
              await sm.json("/api/v1/admin/jobs/" + encodeURIComponent(id) + "/logs", {
                method: "DELETE",
              });
              await loadLogs(logHost, level.value);
            } catch (err) {
              logHost.textContent = "Could not wipe logs.";
            } finally {
              wipe.disabled = false;
            }
          });

          main.appendChild(sm.el("h2", { text: "Logs" }));
          main.appendChild(
            sm.el("p", null, [sm.el("label", null, ["Min level ", level]), " ", wipe]),
          );
          main.appendChild(logHost);
          await loadLogs(logHost, level.value);

          const childHost = sm.el("div");
          main.appendChild(sm.el("h2", { text: "Child jobs" }));
          main.appendChild(childHost);
          await loadChildren(childHost, 0);
        } catch (err) {
          main.textContent = "Could not load this job.";
        }
      }

      async function loadChildren(host, offset) {
        host.textContent = "Loading child jobs...";
        try {
          const url =
            "/api/v1/admin/jobs/" +
            encodeURIComponent(id) +
            "/children" +
            (offset ? "?offset=" + offset : "");
          const page = await sm.json(url);
          host.textContent = "";
          if (!page.items.length) {
            host.appendChild(sm.el("p", { text: "This job has no child jobs." }));
            return;
          }
          const list = sm.el("ul", { class: "sm-job-tree" });
          page.items.forEach((child) => {
            list.appendChild(
              sm.el("li", { style: "margin-left:" + child.depth * 1.5 + "em" }, [
                child.depth ? "↳ " : "",
                sm.el(
                  "a",
                  { href: "job.html?id=" + encodeURIComponent(child.id), title: child.id },
                  child.kind,
                ),
                " " + child.status,
              ]),
            );
          });
          host.appendChild(list);
          if (page.total > page.items.length) {
            const nav = sm.el("nav", { "aria-label": "Child job pagination" });
            if (offset > 0) {
              const prev = sm.el("button", { type: "button" }, "Prev");
              prev.addEventListener("click", () =>
                loadChildren(host, Math.max(0, offset - page.limit)),
              );
              nav.appendChild(prev);
            }
            nav.appendChild(
              sm.el("span", {
                text:
                  " " +
                  (page.offset + 1) +
                  " to " +
                  (page.offset + page.items.length) +
                  " of " +
                  page.total +
                  " ",
              }),
            );
            if (page.offset + page.items.length < page.total) {
              const next = sm.el("button", { type: "button" }, "Next");
              next.addEventListener("click", () => loadChildren(host, offset + page.limit));
              nav.appendChild(next);
            }
            host.appendChild(nav);
          }
        } catch (err) {
          host.textContent = "Could not load child jobs.";
        }
      }

      async function loadLogs(host, level) {
        host.textContent = "Loading logs...";
        try {
          const url =
            "/api/v1/admin/jobs/" +
            encodeURIComponent(id) +
            "/logs" +
            (level ? "?level=" + encodeURIComponent(level) : "");
          const res = await sm.json(url);
          const lines = (res && res.lines) || [];
          host.textContent = "";
          if (!lines.length) {
            host.appendChild(sm.el("p", { text: "No logs." }));
            return;
          }
          host.appendChild(sm.el("pre", { text: lines.join("\n") }));
        } catch (err) {
          host.textContent = "Could not load logs.";
        }
      }
    </script>
  </body>
</html>
