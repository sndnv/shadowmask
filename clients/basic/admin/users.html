<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Admin users</title>
  </head>
  <body>
    <h1 class="sm-visually-hidden">Users</h1>
    <nav id="nav"></nav>
    <p class="sm-crumbs"><a href="index.html">Admin</a> / Users</p>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      const eu = encodeURIComponent;
      let usersHeading = null;
      let usersContainer = null;

      if (sm.requireAuth()) guard();

      async function guard() {
        const main = document.getElementById("main");
        try {
          const me = await sm.self();
          if (me.role !== "admin") {
            main.textContent = "Not Authorized.";
            return;
          }
          main.textContent = "";
          const create = sm.el("button", { type: "button" }, "Create user");
          create.addEventListener("click", () =>
            sm.openDialog("Create user", (box) => createUserBody(box)),
          );
          main.appendChild(sm.el("p", null, create));
          usersHeading = sm.el("h2", { text: "Users" });
          main.appendChild(usersHeading);
          usersContainer = sm.el("div", null);
          main.appendChild(usersContainer);
          await loadUsers();
        } catch (err) {
          main.textContent = "Could not load.";
        }
      }

      function createUserBody(box) {
        const option = (v) => sm.el("option", { value: v }, v);
        const username = sm.el("input", { autocomplete: "off" });
        const password = sm.el("input", { type: "password", autocomplete: "new-password" });
        const role = sm.el("select", null, [option("user"), option("admin"), option("player")]);
        const status = sm.el("span", null);
        const submit = sm.el("button", { type: "submit" }, "Create");
        const form = sm.el("form", null, [
          sm.el("label", null, ["Username ", username]),
          sm.el("br"),
          sm.el("label", null, ["Password ", password]),
          sm.el("br"),
          sm.el("label", null, ["Role ", role]),
          sm.el("br"),
          submit,
          " ",
          status,
        ]);
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!username.value || !password.value) {
            status.textContent = "Username and password are required.";
            return;
          }
          submit.disabled = true;
          try {
            await sm.json("/api/v1/users", {
              method: "POST",
              body: JSON.stringify({
                username: username.value,
                password: password.value,
                role: role.value,
              }),
            });
            sm.toast("User created.", "ok");
            box.close();
            await loadUsers();
          } catch (err) {
            sm.toast("Create failed.", "danger");
            submit.disabled = false;
          }
        });
        return form;
      }

      async function loadUsers() {
        usersContainer.textContent = "Loading…";
        try {
          const page = await sm.json("/api/v1/users");
          usersHeading.textContent = "Users (" + page.total + ")";
          usersContainer.textContent = "";
          const rows = page.items.map((u) => {
            const access = sm.el("button", { type: "button" }, "Access");
            access.addEventListener("click", () =>
              sm.openDialog("Library access: " + u.username, (box) => accessBody(box, u)),
            );
            const codes = sm.el("button", { type: "button" }, "Codes");
            codes.addEventListener("click", () =>
              sm.openDialog("Device link codes: " + u.username, (box) => codesBody(box, u)),
            );
            const del = sm.el("button", { type: "button", class: "sm-danger" }, "Delete");
            del.addEventListener("click", async () => {
              if (!confirm("Delete user " + u.username + "?")) return;
              try {
                await sm.json("/api/v1/users/" + eu(u.id), { method: "DELETE" });
                sm.toast("User deleted.", "ok");
              } catch (err) {
                sm.toast("Delete failed.", "danger");
              }
              await loadUsers();
            });
            return [
              u.username,
              u.role,
              sm.time(u.created_at),
              sm.time(u.updated_at),
              [access, " ", codes, " ", del],
            ];
          });
          usersContainer.appendChild(sm.table(["Username", "Role", "Created", "Updated", ""], rows));
        } catch (err) {
          usersContainer.textContent = "Could not load users.";
        }
      }

      function accessBody(box, user) {
        const container = sm.el("div", null);
        container.textContent = "Loading…";
        (async () => {
          try {
            const [access, libraries] = await Promise.all([
              sm.json("/api/v1/users/" + eu(user.id) + "/libraries"),
              sm.json("/api/v1/libraries"),
            ]);
            const have = new Set(access.map((a) => a.library_id));
            container.textContent = "";
            if (!libraries.length) {
              container.appendChild(sm.el("p", { text: "No libraries exist yet." }));
              return;
            }
            const checks = libraries.map((l) => {
              const cb = sm.el("input", { type: "checkbox", value: l.id });
              if (have.has(l.id)) cb.setAttribute("checked", "checked");
              container.appendChild(sm.el("label", null, [cb, " " + l.name]));
              container.appendChild(sm.el("br"));
              return { cb, l };
            });
            const save = sm.el("button", { type: "button" }, "Save access");
            save.addEventListener("click", async () => {
              const selected = checks.filter(({ cb }) => cb.checked).map(({ l }) => l.id);
              save.disabled = true;
              try {
                await sm.json("/api/v1/users/" + eu(user.id) + "/libraries", {
                  method: "PUT",
                  body: JSON.stringify({ libraries: selected }),
                });
                sm.toast("Access saved.", "ok");
                box.close();
              } catch (err) {
                sm.toast("Save failed.", "danger");
                save.disabled = false;
              }
            });
            container.appendChild(sm.el("p", null, save));
          } catch (err) {
            container.textContent = "Could not load access.";
          }
        })();
        return container;
      }

      function codesBody(box, user) {
        const container = sm.el("div", null);
        const ttl = sm.el("input", { type: "number", min: "1" });
        const output = sm.el("span", null);
        const listBox = sm.el("div", null);
        const create = sm.el("button", { type: "submit" }, "Create code");
        const form = sm.el("form", null, [
          sm.el("label", null, ["TTL seconds (optional) ", ttl]),
          " ",
          create,
          " ",
          output,
        ]);

        async function reloadCodes() {
          listBox.textContent = "Loading…";
          try {
            const list = await sm.json("/api/v1/users/" + eu(user.id) + "/link-codes");
            listBox.textContent = "";
            listBox.appendChild(sm.el("h3", { text: "Pending codes (" + list.length + ")" }));
            if (!list.length) {
              listBox.appendChild(sm.el("p", { text: "No pending codes." }));
              return;
            }
            const rows = list.map((c) => {
              const revoke = sm.el("button", { type: "button", class: "sm-danger" }, "Revoke");
              revoke.addEventListener("click", async () => {
                try {
                  await sm.json("/api/v1/users/" + eu(user.id) + "/link-codes/" + eu(c.code), {
                    method: "DELETE",
                  });
                  sm.toast("Code revoked.", "ok");
                } catch (err) {
                  sm.toast("Revoke failed.", "danger");
                }
                await reloadCodes();
              });
              return [sm.groupCode(c.code), sm.time(c.expires_at), revoke];
            });
            listBox.appendChild(sm.table(["Code", "Expires", ""], rows));
          } catch (err) {
            listBox.textContent = "Could not load pending codes.";
          }
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const body = { user_id: user.id };
          if (ttl.value) body.ttl_secs = parseInt(ttl.value, 10);
          create.disabled = true;
          try {
            const res = await sm.json("/api/v1/auth/link/create", {
              method: "POST",
              body: JSON.stringify(body),
            });
            output.textContent =
              "Code " + sm.groupCode(res.code) + " expires " + sm.time(res.expires_at);
            sm.toast("Code created.", "ok");
            await reloadCodes();
          } catch (err) {
            sm.toast("Could not create a code.", "danger");
          }
          create.disabled = false;
        });

        container.appendChild(form);
        container.appendChild(listBox);
        reloadCodes();
        return container;
      }
    </script>
  </body>
</html>
