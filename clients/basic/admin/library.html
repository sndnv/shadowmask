<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Admin library</title>
  </head>
  <body>
    <h1 class="sm-visually-hidden">Library</h1>
    <nav id="nav"></nav>
    <p class="sm-crumbs"><a href="index.html">Admin</a> / <a href="libraries.html">Libraries</a> / Library</p>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      const eu = encodeURIComponent;
      const libId = sm.qs("id");
      let unmatchedHeading = null;
      let duplicatesHeading = null;
      let versionsHeading = null;

      if (sm.requireAuth()) guard();

      async function guard() {
        const main = document.getElementById("main");
        if (!libId) {
          main.textContent = "No library specified.";
          return;
        }
        try {
          const me = await sm.self();
          if (me.role !== "admin") {
            main.textContent = "Not Authorized.";
            return;
          }
          const library = await sm.json("/api/v1/libraries/" + eu(libId));
          main.textContent = "";
          main.appendChild(sm.el("h2", { text: library.name + " (" + library.kind + ")" }));
          await renderScan(main, library);
          await renderUnmatched(main);
          await renderDuplicates(main);
          await renderVersions(main);
        } catch (err) {
          main.textContent = "Could not load this library.";
        }
      }

      async function renderScan(main, library) {
        main.appendChild(sm.el("h3", { text: "Scan" }));
        const container = sm.el("div", null);
        main.appendChild(container);
        const trigger = sm.el("button", { type: "button" }, "Scan");
        trigger.addEventListener("click", async () => {
          try {
            await sm.json("/api/v1/libraries/" + eu(libId) + "/scan", { method: "POST" });
            sm.toast("Scan queued.", "ok");
          } catch (err) {
            sm.toast("Scan failed.", "danger");
          }
          await reloadScan(container);
        });
        const refresh = sm.el("button", { type: "button", class: "sm-secondary" }, "Refresh metadata");
        refresh.addEventListener("click", confirmRefreshMetadata);
        const reread = sm.el("button", { type: "button", class: "sm-secondary" }, "Re-read files");
        reread.addEventListener("click", () => confirmReread(container));
        const cancel = sm.el("button", { type: "button", class: "sm-secondary" }, "Cancel jobs");
        cancel.addEventListener("click", confirmCancelJobs);
        const purge = sm.el("button", { type: "button", class: "sm-danger" }, "Purge");
        purge.addEventListener("click", () => confirmPurge(library.name));
        const clean = sm.el("button", { type: "button", class: "sm-danger" }, "Clean");
        clean.addEventListener("click", () => confirmClean(library.name));
        main.appendChild(
          sm.el("p", null, [trigger, " ", reread, " ", refresh, " ", cancel, " ", purge, " ", clean]),
        );
        await reloadScan(container);
      }

      function counted(n, one, many) {
        return n + " " + (n === 1 ? one : many);
      }

      function purgedText(done) {
        const parts = [];
        if (done.movies) parts.push(counted(done.movies, "movie", "movies"));
        if (done.series) parts.push(done.series + " series");
        if (done.seasons) parts.push(counted(done.seasons, "season", "seasons"));
        if (done.episodes) parts.push(counted(done.episodes, "episode", "episodes"));
        if (done.subtitles) parts.push(counted(done.subtitles, "subtitle", "subtitles"));
        const what = parts.length ? "Purged: " + parts.join(", ") + "." : "Purged: nothing to remove.";
        if (!done.wiped_users) return what;
        return what + " User data wiped for " + counted(done.wiped_users, "user", "users") + ".";
      }

      function confirmPurge(name) {
        sm.openDialog("Purge library", (box) => {
          const wipe = sm.el("input", { type: "checkbox" });
          const run = sm.el("button", { type: "button", class: "sm-danger" }, "Purge");
          run.addEventListener("click", async () => {
            run.disabled = true;
            try {
              const done = await sm.json("/api/v1/libraries/" + eu(libId) + "/purge", {
                method: "POST",
                body: JSON.stringify({ wipe_user_data: wipe.checked }),
              });
              box.close();
              sm.toast(purgedText(done), "ok");
              await guard();
            } catch (err) {
              run.disabled = false;
              if (err.code === "library_busy") {
                box.close();
                showBusy(err.jobs, "These jobs block the purge.", "purge");
              } else {
                sm.toast("Purge failed. " + err.message, "danger");
              }
            }
          });
          return sm.el("div", null, [
            sm.el("p", null, "Removes the titles of " + name + " with their metadata, artwork and downloaded subtitles, and its unmatched and duplicate lists. Titles another library holds stay."),
            sm.el("p", { class: "sm-subtext" }, "Keeps the files, versions, trickplay, playback prep and other subtitles. Manual relinks and edits are lost."),
            sm.el("p", null, sm.el("label", null, [wipe, " Also wipe user data for these titles: watched, watchlist, favorites, resume positions, subtitle offsets"])),
            run,
          ]);
        });
      }

      function cleanedText(done) {
        const parts = [];
        if (done.versions) parts.push(counted(done.versions, "version", "versions"));
        if (done.movies) parts.push(counted(done.movies, "movie", "movies"));
        if (done.series) parts.push(done.series + " series");
        if (done.seasons) parts.push(counted(done.seasons, "season", "seasons"));
        if (done.episodes) parts.push(counted(done.episodes, "episode", "episodes"));
        const what = parts.length ? "Cleaned: " + parts.join(", ") + "." : "Cleaned: nothing to remove.";
        if (!done.wiped_users) return what;
        return what + " User data wiped for " + counted(done.wiped_users, "user", "users") + ".";
      }

      function confirmClean(name) {
        sm.openDialog("Clean library", (box) => {
          const wipe = sm.el("input", { type: "checkbox" });
          const run = sm.el("button", { type: "button", class: "sm-danger" }, "Clean");
          run.addEventListener("click", async () => {
            run.disabled = true;
            try {
              const done = await sm.json("/api/v1/libraries/" + eu(libId) + "/clean", {
                method: "POST",
                body: JSON.stringify({ wipe_user_data: wipe.checked }),
              });
              box.close();
              sm.toast(cleanedText(done), "ok");
              await guard();
            } catch (err) {
              run.disabled = false;
              if (err.code === "library_busy") {
                box.close();
                showBusy(err.jobs, "These jobs block the clean.", "clean");
              } else {
                sm.toast("Clean failed. " + err.message, "danger");
              }
            }
          });
          return sm.el("div", null, [
            sm.el("p", null, "Removes the versions of " + name + " whose file is gone and the titles left with no version. Files on disk are not touched."),
            sm.el("p", null, sm.el("label", null, [wipe, " Also wipe user data for what is removed: watched, watchlist, favorites, resume positions, subtitle offsets"])),
            run,
          ]);
        });
      }

      function showBusy(jobs, body, blocking) {
        sm.openDialog("Library busy", (box) => {
          const cancel = sm.el("button", { type: "button" }, "Cancel jobs");
          cancel.addEventListener("click", async () => {
            box.close();
            await cancelJobs(blocking);
          });
          const rows = jobs.map((job) =>
            sm.el("li", null, [
              sm.el("a", { href: "job.html?id=" + eu(job.id) }, String(job.kind).replace(/_/g, " ")),
              " " + job.status,
            ]),
          );
          return sm.el("div", null, [sm.el("p", null, body), sm.el("ul", null, rows), cancel]);
        });
      }

      function confirmCancelJobs() {
        sm.openDialog("Cancel jobs", (box) => {
          const run = sm.el("button", { type: "button" }, "Cancel jobs");
          run.addEventListener("click", async () => {
            box.close();
            await cancelJobs();
          });
          return sm.el("div", null, [
            sm.el("p", null, "Cancels this library's queued jobs and stops the running ones that can be stopped."),
            run,
          ]);
        });
      }

      async function cancelJobs(blocking) {
        try {
          const done = await sm.json("/api/v1/libraries/" + eu(libId) + "/jobs/cancel", {
            method: "POST",
            body: blocking ? JSON.stringify({ blocking }) : undefined,
          });
          sm.toast(
            "Cancelled " + done.cancelled + ", stopped " + done.signalled + ", " + done.running + " still running.",
            "ok",
          );
          await guard();
        } catch (err) {
          sm.toast("Cancel failed. " + err.message, "danger");
        }
      }

      function confirmReread(container) {
        sm.openDialog("Re-read files", (box) => {
          const run = sm.el("button", { type: "button" }, "Re-read files");
          run.addEventListener("click", async () => {
            run.disabled = true;
            try {
              await sm.json("/api/v1/libraries/" + eu(libId) + "/scan", {
                method: "POST",
                body: JSON.stringify({ reread: true }),
              });
              sm.toast("Re-read queued.", "ok");
              box.close();
              await reloadScan(container);
            } catch (err) {
              run.disabled = false;
              sm.toast("Scan failed.", "danger");
            }
          });
          return sm.el("div", null, [
            sm.el("p", null, "Read every file in this library again and update its quality, size, duration and tracks."),
            sm.el("p", { class: "sm-subtext" }, "Titles, metadata, artwork, trickplay and subtitles are kept, and no other jobs are queued. Files not seen before are added as a normal scan would."),
            run,
          ]);
        });
      }

      function confirmRefreshMetadata() {
        sm.openDialog("Refresh metadata", (box) => {
          const run = sm.el("button", { type: "button" }, "Refresh metadata");
          run.addEventListener("click", async () => {
            run.disabled = true;
            try {
              await sm.json("/api/v1/libraries/" + eu(libId) + "/refresh-metadata", {
                method: "POST",
              });
              sm.toast("Metadata refresh queued. Track it under Jobs.", "ok");
              box.close();
            } catch (err) {
              run.disabled = false;
              sm.toast("Could not queue the refresh.", "danger");
            }
          });
          return sm.el("div", null, [
            sm.el("p", null, "Re-fetch the description, ratings and artwork for every title in this library."),
            sm.el("p", { class: "sm-subtext" }, "Files are not scanned and nothing is re-processed. Large libraries queue one job per title."),
            run,
          ]);
        });
      }

      async function reloadScan(container) {
        container.textContent = "Loading…";
        try {
          const scan = await sm.json("/api/v1/libraries/" + eu(libId) + "/scan");
          container.textContent =
            "Status " +
            scan.status +
            ", progress " +
            Math.round(scan.progress * 100) +
            "%" +
            (scan.started_at ? ", started " + sm.time(scan.started_at) : "") +
            (scan.last_scanned_at ? ", last scanned " + sm.time(scan.last_scanned_at) : "") +
            (scan.error ? ", error: " + scan.error : "");
        } catch (err) {
          container.textContent = "Could not load scan state.";
        }
      }

      async function renderUnmatched(main) {
        unmatchedHeading = sm.el("h3", { text: "Unmatched files" });
        main.appendChild(unmatchedHeading);
        const container = sm.el("div", null);
        main.appendChild(container);
        await reloadUnmatched(container);
      }

      async function reloadUnmatched(container) {
        container.textContent = "Loading…";
        try {
          const page = await sm.json("/api/v1/libraries/" + eu(libId) + "/unmatched");
          if (unmatchedHeading)
            unmatchedHeading.textContent = "Unmatched files (" + page.items.length + ")";
          container.textContent = "";
          if (!page.items.length) {
            container.appendChild(sm.el("p", { text: "No unmatched files." }));
            return;
          }
          const list = sm.el("ul", null);
          page.items.forEach((file) => {
            const candidateBox = sm.el("div", null);
            const find = sm.el("button", { type: "button" }, "Find matches");
            find.addEventListener("click", () => findCandidates(file, candidateBox, container));
            list.appendChild(
              sm.el("li", null, [sm.el("span", { text: file.path + " " }), find, candidateBox]),
            );
          });
          container.appendChild(list);
        } catch (err) {
          container.textContent = "Could not load unmatched files.";
        }
      }

      async function findCandidates(file, box, unmatchedContainer) {
        box.textContent = " Loading…";
        try {
          const candidates = await sm.json(
            "/api/v1/libraries/" + eu(libId) + "/unmatched/" + eu(file.id) + "/candidates",
          );
          box.textContent = "";
          if (!candidates.length) {
            box.appendChild(sm.el("p", { text: "No candidates." }));
            return;
          }
          const rows = candidates.map((c) => {
            const resolve = sm.el("button", { type: "button" }, "Resolve");
            resolve.addEventListener("click", async () => {
              try {
                await sm.json(
                  "/api/v1/libraries/" + eu(libId) + "/unmatched/" + eu(file.id) + "/resolve",
                  { method: "POST", body: JSON.stringify({ target: c.target }) },
                );
                sm.toast("Resolved.", "ok");
                await reloadUnmatched(unmatchedContainer);
              } catch (err) {
                resolve.textContent = "Failed";
                sm.toast("Resolve failed.", "danger");
              }
            });
            return [c.title + (c.year ? " (" + c.year + ")" : ""), c.kind, c.source, resolve];
          });
          box.appendChild(sm.table(["Match", "Kind", "Source", ""], rows));
        } catch (err) {
          box.textContent = " Could not load candidates.";
        }
      }

      async function renderDuplicates(main) {
        duplicatesHeading = sm.el("h3", { text: "Duplicate candidates" });
        main.appendChild(duplicatesHeading);
        const container = sm.el("div", null);
        main.appendChild(container);
        await reloadDuplicates(container);
      }

      async function reloadDuplicates(container) {
        container.textContent = "Loading…";
        try {
          const page = await sm.json("/api/v1/libraries/" + eu(libId) + "/duplicates");
          if (duplicatesHeading)
            duplicatesHeading.textContent = "Duplicate candidates (" + page.items.length + ")";
          container.textContent = "";
          if (!page.items.length) {
            container.appendChild(sm.el("p", { text: "No duplicate candidates." }));
            return;
          }
          const rows = page.items.map((dup) => {
            const resolve = sm.el("button", { type: "button" }, "Resolve");
            resolve.addEventListener("click", () => act(dup.id, "resolve", container));
            const dismiss = sm.el("button", { type: "button", class: "sm-secondary" }, "Dismiss");
            dismiss.addEventListener("click", () => act(dup.id, "dismiss", container));
            const files = sm.el("div", null);
            if (dup.kind === "multi_part") {
              files.appendChild(
                sm.el("p", null, [
                  sm.el("span", { class: "sm-badge sm-warn", text: "Split" }),
                  " One title split across " +
                    dup.paths.length +
                    " files. Join them into a single file to make it playable.",
                ]),
              );
            }
            files.appendChild(sm.el("span", { text: dup.paths.join(", ") }));
            return [files, [resolve, " ", dismiss]];
          });
          container.appendChild(sm.table(["Files", ""], rows));
        } catch (err) {
          container.textContent = "Could not load duplicates.";
        }
      }

      async function act(dupId, action, container) {
        try {
          await sm.json(
            "/api/v1/libraries/" + eu(libId) + "/duplicates/" + eu(dupId) + "/" + action,
            { method: "POST" },
          );
          sm.toast(action === "resolve" ? "Resolved." : "Dismissed.", "ok");
        } catch (err) {
          sm.toast("Action failed.", "danger");
        }
        await reloadDuplicates(container);
      }

      async function renderVersions(main) {
        versionsHeading = sm.el("h3", { text: "Versions" });
        main.appendChild(versionsHeading);
        const container = sm.el("div", null);
        main.appendChild(container);
        await reloadVersions(container);
      }

      async function reloadVersions(container) {
        container.textContent = "Loading…";
        try {
          const page = await sm.json("/api/v1/libraries/" + eu(libId) + "/versions");
          if (versionsHeading) versionsHeading.textContent = "Versions (" + page.items.length + ")";
          container.textContent = "";
          if (!page.items.length) {
            container.appendChild(sm.el("p", { text: "No versions." }));
            return;
          }
          const names = {};
          try {
            const cards = await sm.json("/api/v1/titles/batch", {
              method: "POST",
              body: JSON.stringify({ titles: page.items.map((v) => v.title) }),
            });
            cards.forEach((c) => {
              const key = c.type + ":" + c.id;
              if (c.type === "episode") {
                names[key] = c.series_title
                  ? sm.seriesEpisodeLine(c.series_title, c.season_number, c.number, "")
                  : sm.episodeLine(c.season_number, c.number, c.title);
              } else {
                names[key] = c.title + (c.year ? " (" + c.year + ")" : "");
              }
            });
          } catch (e) {}
          const rows = page.items.map((v) => {
            const name = names[v.title.type + ":" + v.title.id] || v.title.type + " " + v.title.id;
            const relink = sm.relinkButton(
              v.id,
              name + " (" + (v.quality || "").toUpperCase() + ")",
              () => reloadVersions(container),
              v.available,
            );
            return [
              sm.el("a", { href: sm.href.version(v.id) }, v.path || "(no path)"),
              name,
              (v.quality || "").toUpperCase(),
              v.container,
              sm.gigabytes(v.size_bytes),
              v.available ? "yes" : "no",
              relink,
            ];
          });
          container.appendChild(
            sm.table(
              ["Path", "Title", "Quality", "Container", "Size", "Available", ""],
              rows,
            ),
          );
        } catch (err) {
          container.textContent = "Could not load versions.";
        }
      }
    </script>
  </body>
</html>
