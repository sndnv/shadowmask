<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Admin jobs</title>
  </head>
  <body>
    <h1 class="sm-visually-hidden">Jobs</h1>
    <nav id="nav"></nav>
    <p class="sm-crumbs"><a href="index.html">Admin</a> / <span id="jobs-crumb">Jobs</span></p>
    <p><button type="button" id="refresh">Refresh</button></p>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      if (sm.requireAuth()) guard();

      async function guard() {
        const main = document.getElementById("main");
        try {
          const me = await sm.self();
          if (me.role !== "admin") {
            main.textContent = "Not Authorized.";
            return;
          }
          document.getElementById("refresh").addEventListener("click", load);
          await load();
        } catch (err) {
          main.textContent = "Could not load.";
        }
      }

      function query() {
        const params = new URLSearchParams(location.search);
        return {
          state: params.get("state") === "all" ? "all" : "active",
          filter: params.get("filter") || "",
          offset: Math.max(0, parseInt(params.get("offset") || "0", 10) || 0),
        };
      }

      function jobsHref(overrides) {
        const current = query();
        const params = new URLSearchParams();
        const state = overrides.state || current.state;
        const filter = "filter" in overrides ? overrides.filter : current.filter;
        if (state === "all") params.set("state", "all");
        if (filter) params.set("filter", filter);
        if (overrides.offset) params.set("offset", String(overrides.offset));
        const search = params.toString();
        return "jobs.html" + (search ? "?" + search : "");
      }

      async function load() {
        const main = document.getElementById("main");
        const view = query();
        main.textContent = "Loading…";
        try {
          const params = new URLSearchParams();
          if (view.state === "active") params.set("state", "active");
          if (view.filter) params.set("filter", view.filter);
          if (view.offset) params.set("offset", String(view.offset));
          const search = params.toString();
          const page = await sm.json("/api/v1/admin/jobs" + (search ? "?" + search : ""));
          document.getElementById("jobs-crumb").textContent = "Jobs (" + page.all_total + ")";
          main.textContent = "";

          const tabLink = (label, state) =>
            sm.el(
              "a",
              {
                class: "sm-tab",
                href: jobsHref({ state }),
                "aria-selected": view.state === state ? "true" : "false",
              },
              label,
            );
          main.appendChild(
            sm.el("div", { class: "sm-tabs" }, [
              tabLink("Active (" + page.active_total + ")", "active"),
              tabLink("All (" + page.all_total + ")", "all"),
            ]),
          );

          const filterInput = sm.el("input", {
            type: "search",
            name: "filter",
            value: view.filter,
            placeholder: "id, kind, status...",
            autocomplete: "off",
            "aria-label": "Filter jobs",
          });
          const form = sm.el("form", { method: "get", action: "jobs.html" }, [
            sm.el("label", null, ["Filter ", filterInput]),
            " ",
            sm.el("button", { type: "submit" }, "Apply"),
          ]);
          if (view.state === "all") {
            form.appendChild(sm.el("input", { type: "hidden", name: "state", value: "all" }));
          }
          main.appendChild(form);

          if (!page.items.length) {
            main.appendChild(
              sm.el("p", {
                text: view.filter
                  ? "No jobs match the filter."
                  : view.state === "active"
                    ? "No active jobs."
                    : "No jobs.",
              }),
            );
            return;
          }

          const shortId = (id) => String(id).split("-")[0];
          const idLink = (id) =>
            sm.el("a", { href: "job.html?id=" + encodeURIComponent(id), title: id }, shortId(id));
          const tint = (s) =>
            s === "running"
              ? "sm-row-running"
              : s === "queued"
                ? "sm-row-pending"
                : s === "failed"
                  ? "sm-row-failed"
                  : null;
          const cancelButton = (j) => {
            if (!j.cancellable) return "";
            const btn = sm.el("button", { type: "button", class: "sm-secondary" }, "Cancel");
            btn.addEventListener("click", async () => {
              btn.disabled = true;
              try {
                await sm.json("/api/v1/admin/jobs/" + encodeURIComponent(j.id) + "/cancel", {
                  method: "POST",
                });
                await load();
              } catch (err) {
                btn.disabled = false;
                btn.textContent = "Cancel failed";
              }
            });
            return btn;
          };
          const errorCell = (j) => {
            if (!j.last_error) return "";
            const text = j.last_error.replace(/^(retryable|permanent) job failure:\s*/i, "");
            const label = text.length > 16 ? text.slice(0, 16) + "…" : text;
            const btn = sm.el(
              "button",
              { type: "button", class: "sm-linkbtn", title: "View full error" },
              label,
            );
            btn.addEventListener("click", () =>
              sm.dialog("Job error", sm.el("pre", { class: "sm-subtext", text })),
            );
            return btn;
          };

          const rows = page.items.map((j) => [
            idLink(j.id),
            j.parent_id ? idLink(j.parent_id) : "",
            j.kind,
            j.status,
            String(j.priority),
            Math.round(j.progress * 100) + "%",
            String(j.attempts),
            sm.time(j.started_at),
            sm.time(j.finished_at),
            errorCell(j),
            cancelButton(j),
          ]);
          const headers = [
            "Job",
            "Parent",
            "Kind",
            "Status",
            "Priority",
            "Progress",
            "Attempts",
            "Started",
            "Finished",
            "Error",
            "Actions",
          ];
          const table = sm.table(headers, rows, {
            rowClass: (i) => tint(page.items[i].status),
          });
          table.classList.add("sm-jobs-table");
          main.appendChild(sm.el("div", { class: "sm-table-wrap" }, table));
          main.appendChild(sm.pager(page.total, page.offset, page.limit));
        } catch (err) {
          main.textContent = "Could not load jobs.";
        }
      }
    </script>
  </body>
</html>
