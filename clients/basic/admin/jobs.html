<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Admin jobs</title>
  </head>
  <body>
    <h1 class="sm-visually-hidden">Jobs</h1>
    <nav id="nav"></nav>
    <p class="sm-crumbs"><a href="index.html">Admin</a> / <span id="jobs-crumb">Jobs</span></p>
    <p><button type="button" id="refresh">Refresh</button></p>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      if (sm.requireAuth()) guard();

      async function guard() {
        const main = document.getElementById("main");
        try {
          const me = await sm.self();
          if (me.role !== "admin") {
            main.textContent = "Not Authorized.";
            return;
          }
          document.getElementById("refresh").addEventListener("click", load);
          await load();
        } catch (err) {
          main.textContent = "Could not load.";
        }
      }

      async function load() {
        const main = document.getElementById("main");
        main.textContent = "Loading…";
        try {
          const jobs = await sm.json("/api/v1/admin/jobs");
          document.getElementById("jobs-crumb").textContent = "Jobs (" + jobs.length + ")";
          main.textContent = "";
          if (!jobs.length) {
            main.appendChild(sm.el("p", { text: "No jobs." }));
            return;
          }
          const rank = (s) => (s === "queued" ? 0 : s === "running" ? 1 : 2);
          const byStatus = (a, b) => {
            const byRank = rank(a.status) - rank(b.status);
            if (byRank !== 0) return byRank;
            if (a.started_at && b.started_at) return b.started_at.localeCompare(a.started_at);
            if (a.started_at) return -1;
            if (b.started_at) return 1;
            return (b.created_at || "").localeCompare(a.created_at || "");
          };
          const byId = new Map(jobs.map((j) => [j.id, j]));
          const children = new Map();
          for (const j of jobs) {
            if (j.parent_id && byId.has(j.parent_id)) {
              if (!children.has(j.parent_id)) children.set(j.parent_id, []);
              children.get(j.parent_id).push(j);
            }
          }
          const roots = jobs.filter((j) => !(j.parent_id && byId.has(j.parent_id))).sort(byStatus);
          const shortId = (id) => String(id).split("-")[0];
          const idLink = (j) =>
            sm.el(
              "a",
              { href: "job.html?id=" + encodeURIComponent(j.id), title: j.id },
              shortId(j.id),
            );
          const tint = (s) =>
            s === "running"
              ? "sm-row-running"
              : s === "queued"
                ? "sm-row-pending"
                : s === "failed"
                  ? "sm-row-failed"
                  : null;
          const cancelButton = (j) => {
            if (!j.cancellable) return "";
            const btn = sm.el("button", { type: "button", class: "sm-secondary" }, "Cancel");
            btn.addEventListener("click", async () => {
              btn.disabled = true;
              try {
                await sm.json("/api/v1/admin/jobs/" + encodeURIComponent(j.id) + "/cancel", {
                  method: "POST",
                });
                await load();
              } catch (err) {
                btn.disabled = false;
                btn.textContent = "Cancel failed";
              }
            });
            return btn;
          };
          const errorCell = (j) => {
            if (!j.last_error) return "";
            const text = j.last_error.replace(/^(retryable|permanent) job failure:\s*/i, "");
            const label = text.length > 16 ? text.slice(0, 16) + "…" : text;
            const btn = sm.el(
              "button",
              { type: "button", class: "sm-linkbtn", title: "View full error" },
              label,
            );
            btn.addEventListener("click", () =>
              sm.dialog("Job error", sm.el("pre", { class: "sm-subtext", text })),
            );
            return btn;
          };

          const active = jobs
            .filter((j) => j.status === "queued" || j.status === "running")
            .sort(byStatus);
          const activePanel = sm.el("div");
          if (!active.length) {
            activePanel.appendChild(sm.el("p", { text: "No active jobs." }));
          } else {
            const activeRows = active.map((j) => [
              idLink(j),
              j.kind,
              j.status,
              Math.round(j.progress * 100) + "%",
              cancelButton(j),
            ]);
            activePanel.appendChild(
              sm.table(["Job", "Kind", "Status", "Progress", ""], activeRows, {
                rowClass: (i) => tint(active[i].status),
              }),
            );
          }

          const ordered = [];
          const walk = (j, depth) => {
            ordered.push({ job: j, depth });
            (children.get(j.id) || [])
              .slice()
              .sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""))
              .forEach((k) => walk(k, depth + 1));
          };
          roots.forEach((r) => walk(r, 0));
          const treeRows = ordered.map(({ job: j, depth }) => {
            const first = depth
              ? sm.el("span", { style: "padding-left:" + depth * 1.5 + "em" }, ["↳ ", idLink(j)])
              : idLink(j);
            return [
              first,
              j.kind,
              j.status,
              String(j.priority),
              Math.round(j.progress * 100) + "%",
              String(j.attempts),
              sm.time(j.started_at),
              sm.time(j.finished_at),
              errorCell(j),
              cancelButton(j),
            ];
          });
          const headers = ["Job", "Kind", "Status", "Priority", "Progress", "Attempts", "Started", "Finished", "Error", "Actions"];
          const allTable = sm.table(headers, treeRows, {
            rowClass: (index) => tint(ordered[index].job.status),
          });
          allTable.classList.add("sm-jobs-tree");
          const trs = allTable.querySelectorAll("tbody tr");
          const filter = sm.el("input", {
            type: "search",
            placeholder: "filter by id, kind, status...",
            autocomplete: "off",
            "aria-label": "Filter jobs",
          });
          filter.addEventListener("input", () => {
            const needle = filter.value.trim().toLowerCase();
            trs.forEach((tr) => {
              tr.hidden = needle !== "" && !tr.textContent.toLowerCase().includes(needle);
            });
          });
          const allPanel = sm.el("div");
          allPanel.appendChild(sm.el("p", null, sm.el("label", null, ["Filter ", filter])));
          allPanel.appendChild(allTable);

          main.appendChild(
            sm.tabs(
              [
                { label: "Active (" + active.length + ")", panel: activePanel },
                { label: "All (" + jobs.length + ")", panel: allPanel },
              ],
              active.length ? 0 : 1,
            ),
          );
        } catch (err) {
          main.textContent = "Could not load jobs.";
        }
      }
    </script>
  </body>
</html>
