<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Shadowmask (basic) - Admin libraries</title>
  </head>
  <body>
    <h1 class="sm-visually-hidden">Libraries</h1>
    <nav id="nav"></nav>
    <p class="sm-crumbs"><a href="index.html">Admin</a> / Libraries</p>
    <main id="main">Loading&hellip;</main>
    <script src="../app.js"></script>
    <script>
      sm.chrome();
      const eu = encodeURIComponent;
      let listContainer = null;
      let listHeading = null;

      if (sm.requireAuth()) guard();

      async function guard() {
        const main = document.getElementById("main");
        try {
          const me = await sm.self();
          if (me.role !== "admin") {
            main.textContent = "Not Authorized.";
            return;
          }
          main.textContent = "";
          const create = sm.el("button", { type: "button" }, "Create library");
          create.addEventListener("click", () =>
            sm.openDialog("Create library", (box) => libraryFormBody(box, null)),
          );
          main.appendChild(sm.el("p", null, create));
          listHeading = sm.el("h2", { text: "Existing libraries" });
          main.appendChild(listHeading);
          listContainer = sm.el("div", null);
          main.appendChild(listContainer);
          await loadLibraries();
        } catch (err) {
          main.textContent = "Could not load.";
        }
      }

      function libraryFormBody(box, library) {
        const option = (v) => sm.el("option", { value: v }, v);
        const fields = {
          name: sm.el("input", { autocomplete: "off" }),
          kind: sm.el("select", null, [option("movie"), option("tv")]),
          origin: sm.el("select", null, [option("local"), option("external")]),
          watcher: sm.el("select", null, [
            option("local"),
            option("polling"),
            option("scheduled"),
            option("manual"),
          ]),
          roots: sm.el("textarea", { rows: "3", cols: "40" }),
          schedule: sm.el("input", { autocomplete: "off" }),
          sources: sm.el("input", { autocomplete: "off" }),
          articles: sm.el("input", { autocomplete: "off" }),
        };
        fields.articles.value = "the, a, an";
        fields.kind.value = library ? library.kind : "movie";
        fields.origin.value = library ? library.origin || "local" : "local";
        fields.watcher.value = library ? library.watcher : "local";
        if (library) {
          fields.name.value = library.name;
          fields.roots.value = (library.roots || []).join("\n");
          fields.schedule.value = library.scan_schedule || "";
          fields.sources.value = (library.metadata_sources || []).join(", ");
          fields.articles.value = (library.sort_articles || []).join(", ");
        }
        const status = sm.el("span", null);
        const submit = sm.el("button", { type: "submit" }, library ? "Save changes" : "Create");
        const form = sm.el("form", null, [
          sm.el("label", null, ["Name ", fields.name]),
          sm.el("br"),
          sm.el("label", null, ["Kind ", fields.kind]),
          " ",
          sm.el("label", null, ["Origin ", fields.origin]),
          " ",
          sm.el("label", null, ["Watcher ", fields.watcher]),
          sm.el("br"),
          sm.el("label", null, ["Roots (one path per line) ", sm.el("br"), fields.roots]),
          sm.el("br"),
          sm.el("label", null, ["Scan schedule (optional cron) ", fields.schedule]),
          sm.el("br"),
          sm.el("label", null, ["Metadata sources (comma separated) ", fields.sources]),
          sm.el("br"),
          sm.el("label", null, [
            "Ignored sort articles (comma separated, applied on the next scan) ",
            fields.articles,
          ]),
          sm.el("br"),
          submit,
          " ",
          status,
        ]);
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const body = {
            name: fields.name.value,
            kind: fields.kind.value,
            origin: fields.origin.value,
            watcher: fields.watcher.value,
            roots: splitLines(fields.roots.value),
            scan_schedule: fields.schedule.value ? fields.schedule.value : null,
            metadata_sources: splitCommas(fields.sources.value),
            sort_articles: splitCommas(fields.articles.value),
          };
          if (!body.name) {
            status.textContent = "Name is required.";
            return;
          }
          submit.disabled = true;
          try {
            if (library) {
              await sm.json("/api/v1/libraries/" + eu(library.id), {
                method: "PUT",
                body: JSON.stringify(body),
              });
            } else {
              await sm.json("/api/v1/libraries", { method: "POST", body: JSON.stringify(body) });
            }
            sm.toast("Library saved.", "ok");
            box.close();
            await loadLibraries();
          } catch (err) {
            sm.toast("Save failed.", "danger");
            submit.disabled = false;
          }
        });
        return form;
      }

      function splitLines(value) {
        return value
          .split("\n")
          .map((x) => x.trim())
          .filter((x) => x.length);
      }

      function splitCommas(value) {
        return value
          .split(",")
          .map((x) => x.trim())
          .filter((x) => x.length);
      }

      async function loadLibraries() {
        listContainer.textContent = "Loading…";
        try {
          const libraries = await sm.json("/api/v1/libraries");
          listHeading.textContent = "Existing libraries (" + libraries.length + ")";
          listContainer.textContent = "";
          if (!libraries.length) {
            listContainer.appendChild(sm.el("p", { text: "No libraries." }));
            return;
          }
          const rows = libraries.map((l) => {
            const sync = sm.el("button", { type: "button" }, "Scan");
            sync.addEventListener("click", async () => {
              sync.disabled = true;
              try {
                await sm.json("/api/v1/libraries/" + eu(l.id) + "/scan", { method: "POST" });
                sm.toast("Scan queued for " + l.name + ".", "ok");
              } catch (err) {
                sm.toast("Scan failed for " + l.name + ".", "danger");
              } finally {
                sync.disabled = false;
              }
            });
            const edit = sm.el("button", { type: "button" }, "Edit");
            edit.addEventListener("click", () =>
              sm.openDialog("Edit library: " + l.name, (box) => libraryFormBody(box, l)),
            );
            const del = sm.el("button", { type: "button", class: "sm-danger" }, "Delete");
            del.addEventListener("click", async () => {
              if (!confirm("Delete library " + l.name + "?")) return;
              try {
                await sm.json("/api/v1/libraries/" + eu(l.id), { method: "DELETE" });
                sm.toast("Library deleted.", "ok");
              } catch (err) {
                sm.toast("Delete failed.", "danger");
              }
              await loadLibraries();
            });
            const actions = sm.el("span", null, [sync, " ", edit, " ", del]);
            return [
              sm.el("a", { href: "library.html?id=" + eu(l.id) }, sm.el("strong", { text: l.name })),
              l.kind,
              l.origin || "local",
              l.watcher,
              l.roots && l.roots.length ? l.roots.join(", ") : "",
              sm.time(l.created_at),
              sm.time(l.updated_at),
              actions,
            ];
          });
          listContainer.appendChild(
            sm.table(
              ["Name", "Kind", "Origin", "Watcher", "Roots", "Created", "Updated", ""],
              rows,
            ),
          );
        } catch (err) {
          listContainer.textContent = "Could not load libraries.";
        }
      }
    </script>
  </body>
</html>
