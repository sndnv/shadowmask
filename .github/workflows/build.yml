name: Shadowmask Build

permissions:
  contents: read

on:
  push:
    branches-ignore: ["dependabot/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python 3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Verify assets
        run: ./assets/refresh_assets.py --verify

  rust-qa:
    needs:
      - assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-deny,cargo-about@0.9.2

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - run: python3 qa.py

  flutter-qa:
    needs:
      - assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Run Flutter QA
        run: |
          sudo apt update -y
          sudo apt install -y lcov
          cd clients/flutter
          ./qa.py

  roku-qa:
    needs:
      - assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Roku QA
        run: python3 clients/roku/qa.py

  flutter-build:
    needs:
      - flutter-qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            os: ubuntu-latest
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: macos
            os: macos-latest
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: matrix.target == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv

      - name: Generate sources
        run: |
          cd clients/flutter
          flutter pub get
          dart run build_runner build

      - name: Build web bundle
        if: matrix.target == 'web'
        run: |
          cd clients/flutter
          flutter build web --release --no-web-resources-cdn

      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          cd clients/flutter
          flutter build apk --debug

      - name: Build Linux bundle
        if: matrix.target == 'linux'
        run: |
          cd clients/flutter
          flutter build linux --release

      - name: Build macOS app
        if: matrix.target == 'macos'
        run: |
          cd clients/flutter
          flutter build macos --release

      - name: Build iOS app
        if: matrix.target == 'ios'
        run: |
          cd clients/flutter
          flutter build ios --release --no-codesign

  roku-build:
    needs:
      - roku-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build Roku channel
        run: python3 clients/roku/package.py
