name: Shadowmask Publish (Branch)

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/sndnv/shadowmask

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Log into registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build and push server image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/server:dev-latest

      - name: Build and push enrichment server image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./Dockerfile
          target: runtime-enrichment
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/server:dev-latest-enrichment

  web-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Build web bundle
        run: python3 clients/flutter/deployment/production/stage.py

      - name: Log into registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build and push web UI image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: clients/flutter
          file: clients/flutter/deployment/production/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/web-ui:dev-latest

  desktop-linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Setup Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'

      - name: Build Linux bundle
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv
          cd clients/flutter
          flutter pub get
          dart run build_runner build
          flutter build linux --release

      - name: Build AppImage
        run: |
          pip install git+https://github.com/AppImageCrafters/appimage-builder.git@42d32f11496de43a9f6a9ada7882a11296e357ca
          cd clients/flutter
          appimage-builder --skip-test
          mv *.AppImage shadowmask-client-linux-dev-latest.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: client-linux
          path: clients/flutter/shadowmask-client-linux-dev-latest.AppImage
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Build macOS app and disk image
        run: |
          brew install create-dmg
          cd clients/flutter
          flutter pub get
          dart run build_runner build
          flutter build macos --release
          mkdir -p dmg/Licenses
          cp -R build/macos/Build/Products/Release/shadowmask.app dmg/
          cp CREDITS.md dmg/
          cp assets/licenses/*.txt dmg/Licenses/
          create-dmg \
            --volname "shadowmask" \
            --window-size 800 400 \
            --icon "shadowmask.app" 200 200 \
            --app-drop-link 600 200 \
            "shadowmask-client-macos-dev-latest.dmg" \
            dmg/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: client-macos
          path: clients/flutter/shadowmask-client-macos-dev-latest.dmg
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Decode keystore
        uses: timheuer/base64-to-file@784a1a4a994315802b7d8e2084e116e783d157be
        with:
          fileName: 'signing.jks'
          fileDir: './clients/flutter/android/app/secrets/'
          encodedString: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}

      - name: Build Android APK
        env:
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
        run: |
          cd clients/flutter
          flutter pub get
          dart run build_runner build
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk shadowmask-client-android-dev-latest.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: client-android
          path: clients/flutter/shadowmask-client-android-dev-latest.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          flutter-version: '3.47.1'

      - name: Build unsigned iOS app
        run: |
          cd clients/flutter
          flutter pub get
          dart run build_runner build
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r shadowmask-client-ios-dev-latest.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: client-ios
          path: clients/flutter/shadowmask-client-ios-dev-latest.ipa
          if-no-files-found: error
          retention-days: 7

  roku:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Build Roku channel
        run: python3 clients/roku/package.py --output shadowmask-client-roku-dev-latest.zip

      - name: Upload Roku artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: client-roku
          path: shadowmask-client-roku-dev-latest.zip
          if-no-files-found: error
          retention-days: 7
