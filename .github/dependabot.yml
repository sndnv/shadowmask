version: 2

multi-ecosystem-groups:
  all:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all

  - package-ecosystem: pub
    directory: /clients/flutter
    patterns: ["*"]
    multi-ecosystem-group: all

  - package-ecosystem: npm
    directory: /clients/roku/tooling
    patterns: ["*"]
    multi-ecosystem-group: all

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all

  - package-ecosystem: docker
    directories:
      - /
      - /clients/flutter/deployment/production
    patterns: ["*"]
    multi-ecosystem-group: all
