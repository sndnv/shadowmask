[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-SNAPSHOT"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/sndnv/shadowmask"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
persistence = { path = "crates/persistence" }
media = { path = "crates/media" }
metadata = { path = "crates/metadata" }
services = { path = "crates/services" }
mocks = { path = "crates/mocks" }
jobs = { path = "crates/jobs" }
api = { path = "crates/api" }
contracts = { path = "crates/contracts" }
inference = { path = "crates/inference" }
fetch = { path = "crates/fetch" }

tokio = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
lru = "0.18"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors"] }
sqlx = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = "0.10"
thiserror = "2"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
jiff = "0.2"
jiff-cron = "0.3"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
regex = "1"
sanitize-filename = "0.6"
unicode-normalization = "0.1"
url = "2"
walkdir = "2"
notify = "8"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
subst = "0.3"
toml = "1"
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
clap = { version = "4", features = ["derive"] }
tar = { version = "0.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
debug = "line-tables-only"
