[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
domain = { path = "crates/domain" }
persistence = { path = "crates/persistence" }
media = { path = "crates/media" }
metadata = { path = "crates/metadata" }
services = { path = "crates/services" }
jobs = { path = "crates/jobs" }
api = { path = "crates/api" }

tokio = "1"
axum = "0.8"
sqlx = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = "0.10"
thiserror = "2"
anyhow = "1"
argon2 = "0.5"
jiff = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
