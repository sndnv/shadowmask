name: shadowmask-dev

services:
  shadowmask:
    image: ghcr.io/sndnv/shadowmask-server:dev-latest
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    ports:
      - "${SHADOWMASK_PORT:-8080}:8080"
    environment:
      SHADOWMASK_LOG_LEVEL: "debug"
      SHADOWMASK_SQLX_LOG_LEVEL: "warn"
      SHADOWMASK_JWT_SECRET: "dev-jwt-secret"
      SHADOWMASK_STREAM_SECRET: "dev-stream-secret"
      SHADOWMASK_TMDB_API_KEY: "${SHADOWMASK_TMDB_API_KEY:-}"
      SHADOWMASK_OMDB_API_KEY: "${SHADOWMASK_OMDB_API_KEY:-}"
      SHADOWMASK_OPENSUBTITLES_API_KEY: "${SHADOWMASK_OPENSUBTITLES_API_KEY:-}"
      SHADOWMASK_BOOTSTRAP_MODE: "init-and-start"
      SHADOWMASK_ADMIN_USERNAME: "admin"
      SHADOWMASK_ADMIN_PASSWORD: "${SHADOWMASK_ADMIN_PASSWORD:-passw0rd}"
      SHADOWMASK_FETCH_PROVIDERS_ENABLED: "${SHADOWMASK_FETCH_PROVIDERS_ENABLED:-true}"
    volumes:
      - shadowmask-data:/data
      - ./config/bootstrap:/config/bootstrap:ro
      - ../../clients/basic:/usr/share/shadowmask/basic:ro
      - "${SHADOWMASK_MOVIES_DIR:-./media/movies}:/media/movies:ro"
      - "${SHADOWMASK_TV_DIR:-./media/tv}:/media/tv:ro"
      - "${SHADOWMASK_EXTERNAL_DIR:-./media/external}:/media/external"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Optional monitoring, started with: docker compose -f docker-compose.base.yml --profile monitoring up -d
  prometheus:
    image: docker.io/prom/prometheus
    restart: unless-stopped
    profiles: [ "monitoring" ]
    logging:
      driver: none
    ports:
      - "${SHADOWMASK_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../production/telemetry/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: docker.io/grafana/grafana
    restart: unless-stopped
    profiles: [ "monitoring" ]
    logging:
      driver: none
    ports:
      - "${SHADOWMASK_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../production/telemetry/grafana:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  shadowmask-data:
  prometheus-data:
  grafana-data:
