# Bootstrap library definitions. Copy and edit for your deployment.
# kind: movie | tv
# watcher: local | polling | scheduled | manual
# scan_schedule: optional cron expression (used by the scheduled watcher)
# metadata_sources: provider ids, e.g. "tmdb"
# roots must point at directories the server can read.

[[libraries]]
name = "Movies"
kind = "movie"
roots = ["/media/movies"]
watcher = "local"
metadata_sources = ["tmdb"]

[[libraries]]
name = "TV"
kind = "tv"
roots = ["/media/tv"]
watcher = "local"
metadata_sources = ["tmdb"]
