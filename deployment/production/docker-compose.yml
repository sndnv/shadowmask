name: shadowmask

services:
  shadowmask:
    image: ghcr.io/sndnv/shadowmask/server:${SHADOWMASK_VERSION:-latest}
    restart: always
    init: true
    stop_grace_period: 40s
    ports:
      - "${SHADOWMASK_PORT:-8080}:8080"
    env_file:
      - ./secrets/shadowmask.env
    environment:
      SHADOWMASK_LOG_LEVEL: "info"
      SHADOWMASK_SQLX_LOG_LEVEL: "warn"
      SHADOWMASK_BOOTSTRAP_MODE: "off"
      # Optional TLS (off by default): point these at a mounted cert + key to serve HTTPS
      # directly. Leave unset to serve plaintext HTTP (fine on a trusted LAN or behind your
      # own reverse proxy). When enabled, update the healthcheck below to https (curl -k).
      # SHADOWMASK_TLS_CERT: "/config/tls/cert.pem"
      # SHADOWMASK_TLS_KEY: "/config/tls/key.pem"
    volumes:
      - ./local/data:/data
      - ./bootstrap:/config/bootstrap:ro
      # - ./tls:/config/tls:ro   # mount your cert + key here when using SHADOWMASK_TLS_* above
      - "${SHADOWMASK_MOVIES_DIR:?set SHADOWMASK_MOVIES_DIR to your movies library path}:/media/movies:ro"
      - "${SHADOWMASK_TV_DIR:?set SHADOWMASK_TV_DIR to your tv library path}:/media/tv:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Hardware-accelerated transcoding (VAAPI / Intel QuickSync) via the host GPU.
    # Uncomment and make sure the container user (uid 1001) can read the render node.
    # devices:
    #   - "/dev/dri:/dev/dri"
    # NVIDIA NVENC needs the nvidia-container-toolkit installed on the host; then uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: ["gpu"]
