[package]
name = "inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
domain.workspace = true
regex.workspace = true
subtp = "0.2"
tokio = { workspace = true, features = ["fs", "rt"] }
tracing.workspace = true
uuid.workspace = true
ct2rs = { version = "0.11", optional = true, features = ["whisper"] }
ct2rs-sys = { version = "0.11", optional = true, default-features = false }
flate2 = { version = "1", optional = true }
mel_spec = { version = "0.5", optional = true }
ndarray = { version = "0.16", optional = true }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
ct2rs = { version = "0.11", optional = true, features = ["whisper", "dnnl"] }

[features]
enrichment = ["dep:ct2rs", "dep:ct2rs-sys", "dep:flate2", "dep:mel_spec", "dep:ndarray"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
flate2 = "1"
mel_spec = "0.5"
ndarray = "0.16"

[lints]
workspace = true
